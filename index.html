       function Icon({ path, className = "h-5 w-5", filled = false }) {
           return <svg xmlns="http://www.w3.org/2000/svg" className={className} fill={filled ? 'currentColor' : 'none'} viewBox="0 0 24 24" stroke="currentColor" strokeWidth={filled ? 0 : 1.6}>{path}</svg>;
       }

       function parseTimestamp(ts) {
           if (!ts) return new Date();
           if (typeof ts === 'string' && ts.includes('/')) {
               const parts = ts.trim().split(' ');
               const dateParts = parts[0].split('/');
               if (dateParts.length === 3) {
                   const d = new Date(`${dateParts[2]}-${dateParts[1].padStart(2, '0')}-${dateParts[0].padStart(2, '0')}T${parts[1] || '00:00:00'}`);
                   if (!isNaN(d.getTime())) return d;
               }
           }
           const fallback = new Date(ts);
           return isNaN(fallback.getTime()) ? new Date() : fallback;
       }

       const isSameDay = (a, b) => a.toDateString() === b.toDateString();
       const startOfWeek = (d) => { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); x.setHours(0,0,0,0); return x; };
       const startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);

       function inRange(ts, start, end) { const t = parseTimestamp(ts).getTime(); return t >= start.getTime() && t <= end.getTime(); }

       function exportCSV(logs, filenameHint) {
           const header = ['Nama', 'NISN', 'Kelas', 'Keterangan', 'Tanggal', 'Waktu', 'Dicatat Oleh'];
           const rows = logs.map(l => {
               const dt = parseTimestamp(l.timestamp);
               return [l.name, l.nisn || '', l.class, l.type || l.jenis_pelanggaran || l.jenis || '', dt.toLocaleDateString('id-ID'), dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }), l.logged_by || ''];
           });
           const csv = [header, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
           const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
           const url = URL.createObjectURL(blob);
           const a = document.createElement('a'); a.href = url; a.download = `SIGAP_${filenameHint}_${new Date().toISOString().slice(0, 10)}.csv`;
           document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
       }

           return <span className={`text-[9px] font-bold uppercase tracking-wider px-2 py-1 rounded-full border ${tones[tone]}`}>{children}</span>;
       }

       function GerbangTab({ students, onSelectLate, onAddSurat }) {
           const [mode, setMode] = useState('terlambat');
           const [searchQuery, setSearchQuery] = useState('');
           const [suratStudent, setSuratStudent] = useState(null);
           const [jenis, setJenis] = useState('Sakit');
           const [keterangan, setKeterangan] = useState('');
           const [savingSurat, setSavingSurat] = useState(false);
           const [msg, setMsg] = useState('');

           const filtered = searchQuery.trim() === '' ? [] : students.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase()) || (s.nisn && s.nisn.toString().includes(searchQuery.trim())));

           const handleSelect = (s) => {
               setSearchQuery('');
               if (mode === 'terlambat') onSelectLate(s);
               else setSuratStudent(s);
           };

           const submitSurat = () => {
               setSavingSurat(true);
               onAddSurat({ nisn: suratStudent.nisn, name: suratStudent.name, class_name: suratStudent.class, jenis, keterangan }, (ok, text) => {
                   setSavingSurat(false);
                   setMsg(text); setTimeout(() => setMsg(''), 3000);
               });
               setSuratStudent(null); setJenis('Sakit'); setKeterangan('');
           };

           return (
               <div className="space-y-4 animate-rise">
                   <div className="grid grid-cols-2 gap-2 bg-white border border-slate-200 rounded-2xl p-1.5">
                       <button onClick={() => setMode('terlambat')} className={`py-2 rounded-xl text-xs font-bold transition ${mode === 'terlambat' ? 'bg-sky text-white shadow-md' : 'text-slate-500'}`}>Catat Terlambat</button>
                       <button onClick={() => setMode('surat')} className={`py-2 rounded-xl text-xs font-bold transition ${mode === 'surat' ? 'bg-sky text-white shadow-md' : 'text-slate-500'}`}>Catat Surat</button>
                   </div>
                   {msg && <div className="text-xs text-sky-dim text-center bg-sky-dim/15 py-2 rounded-lg">{msg}</div>}
                   <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Cari nama atau NISN siswa..." className="w-full bg-white border-2 border-slate-200 rounded-2xl px-4 py-3 text-sm shadow-sm" />
                   {searchQuery.trim() !== '' && (
                       <div className="bg-white rounded-2xl border border-slate-200 max-h-60 overflow-y-auto">
                           {filtered.map(s => (
                               <div key={s.nisn} onClick={() => handleSelect(s)} className="px-4 py-3.5 border-b flex items-center justify-between hover:bg-slate-50 cursor-pointer">
                                   <div><div className="font-bold text-sm">{s.name}</div><div className="text-xs text-sky-dim">{s.class}</div></div>
                                   <span className="text-xs bg-sky text-white px-3 py-1.5 rounded-lg font-semibold">Pilih</span>
                               </div>
                           ))}
                       </div>
                   )}

                   {suratStudent && (
                       <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">

                               <div className="grid grid-cols-3 gap-2">
                                   {['Sakit', 'Izin', 'Lainnya'].map(j => <button key={j} onClick={() => setJenis(j)} className={`py-2 rounded-xl text-xs font-bold ${jenis === j ? 'bg-sky text-white' : 'bg-slate-100 text-slate-600'}`}>{j}</button>)}
                               </div>
                               <input type="text" value={keterangan} onChange={(e) => setKeterangan(e.target.value)} placeholder="Keterangan..." className="w-full border rounded-xl px-3 py-2 text-xs" />

       }

       function LogTab({ allLogs, pelanggaranList, suratList, onDeleteLog }) {
           const [category, setCategory] = useState('terlambat');
           const [search, setSearch] = useState('');
           const [msg, setMsg] = useState('');

           const categories = [
               { key: 'terlambat', label: 'Terlambat', data: allLogs },
               { key: 'pelanggaran', label: 'Pelanggaran', data: pelanggaranList },
               { key: 'surat', label: 'Surat', data: suratList },
           ];
           const activeCat = categories.find(c => c.key === category);
           const filtered = activeCat.data.filter(l => !search.trim() || l.name.toLowerCase().includes(search.toLowerCase())).sort((a, b) => parseTimestamp(b.timestamp) - parseTimestamp(a.timestamp));

           const handleDelete = (item) => {
               if (!confirm(`Hapus catatan untuk ${item.name}?`)) return;
               onDeleteLog({ category, id: item.id || item.timestamp, nisn: item.nisn }, (ok, text) => {
                   setMsg(text); setTimeout(() => setMsg(''), 3000);
               });
           };

           return (
               <div className="space-y-4 animate-rise">
                   <div className="grid grid-cols-3 gap-2 bg-white border border-slate-200 rounded-2xl p-1.5">
                       {categories.map(c => (
                           <button key={c.key} onClick={() => setCategory(c.key)} className={`py-2 rounded-xl text-xs font-bold transition ${category === c.key ? 'bg-sky text-white shadow-md' : 'text-slate-500'}`}>{c.label}</button>
                       ))}
                   </div>
                   {msg && <div className="text-xs text-sky-dim font-medium text-center bg-sky-dim/15 py-2 rounded-lg">{msg}</div>}
                   <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Cari nama siswa..." className="w-full bg-white border-2 border-slate-200 rounded-2xl px-4 py-2.5 text-sm" />
                   <div className="space-y-2.5">
                       {filtered.map((item, idx) => {
                           const dt = parseTimestamp(item.timestamp);
                           return (
                               <div key={idx} className="bg-white border border-slate-200 p-3.5 rounded-xl flex items-center justify-between shadow-sm">
                                   <div className="min-w-0 pr-3">
                                       <div className="font-semibold text-sm text-slate-900 truncate">{item.name}</div>
                                       <div className="text-xs text-sky-dim font-medium">{item.class} • <span className="text-slate-600">{item.type || item.jenis_pelanggaran || item.jenis}</span></div>
                                       <div className="text-[10px] text-slate-400 mt-0.5">{dt.toLocaleDateString('id-ID')} • {dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</div>
                                   </div>
                                   <button onClick={() => handleDelete(item)} className="text-[10px] font-bold bg-crimson/10 text-crimson border border-crimson/30 px-3 py-2 rounded-xl flex-shrink-0">Hapus</button>
                               </div>
                           );
                       })}
                       {filtered.length === 0 && <EmptyState emoji="🔍" text="Tidak ada catatan ditemukan." />}
                   </div>
               </div>
           );
       }

       function StatsTab({ allLogs, pelanggaranList, suratList, canExport }) {
           const [category, setCategory] = useState('terlambat');
           const [period, setPeriod] = useState('mingguan');
           const [selectedClassDetail, setSelectedClassDetail] = useState(null);

           const categories = [{ key: 'terlambat', label: 'Terlambat', data: allLogs }, { key: 'pelanggaran', label: 'Pelanggaran', data: pelanggaranList }, { key: 'surat', label: 'Surat', data: suratList }];
           const activeCat = categories.find(c => c.key === category);

           const periodData = activeCat.data.filter(l => {
               const now = new Date();
               if (period === 'mingguan') return inRange(l.timestamp, startOfWeek(now), now);
               if (period === 'bulanan') return inRange(l.timestamp, startOfMonth(now), now);
               return true;
           });

           const classMap = {};
           periodData.forEach(l => {
               const cls = l.class || 'Lainnya';
               if (!classMap[cls]) classMap[cls] = [];
               classMap[cls].push(l);
           });
           const sortedClasses = Object.entries(classMap).map(([cls, items]) => [cls, items.length, items]).sort((a, b) => b[1] - a[1]);

           const frequentStudents = useMemo(() => {
               if (category !== 'terlambat') return [];
               const studentMap = {};
               periodData.forEach(l => {
                   const key = l.nisn || l.name;
                   if (!studentMap[key]) studentMap[key] = { name: l.name, class: l.class, count: 0 };
                   studentMap[key].count += 1;
               });
               return Object.values(studentMap).filter(s => s.count >= 3).sort((a, b) => b.count - a.count);
           }, [periodData, category]);

           return (
               <div className="space-y-5 animate-rise">
                   <div className="grid grid-cols-3 gap-2 bg-white border border-slate-200 rounded-2xl p-1.5">
                       {categories.map(c => <button key={c.key} onClick={() => setCategory(c.key)} className={`py-2 rounded-xl text-xs font-bold ${category === c.key ? 'bg-sky text-white' : 'text-slate-500'}`}>{c.label}</button>)}
                   </div>
                   <div className="flex gap-1.5 overflow-x-auto pb-1">
                       {['mingguan', 'bulanan', 'semester', 'tahunan'].map(p => <button key={p} onClick={() => setPeriod(p)} className={`px-3.5 py-1.5 rounded-xl text-xs font-bold uppercase whitespace-nowrap ${period === p ? 'bg-navy text-white' : 'bg-white border text-slate-500'}`}>{p}</button>)}
                   </div>

                   <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
                       <h3 className="text-xs font-display font-bold text-slate-800 uppercase">Rekapitulasi Seluruh Kelas (Klik kelas untuk detail)</h3>
                       <div className="divide-y divide-slate-100 max-h-60 overflow-y-auto">
                           {sortedClasses.map(([cls, count, items], idx) => (
                               <div key={cls} onClick={() => setSelectedClassDetail({ cls, items })} className="py-3 flex items-center justify-between text-xs cursor-pointer hover:bg-slate-50 px-2 rounded-lg transition">
                                   <span className="font-semibold text-slate-800">{idx + 1}. {cls}</span>
                                   <span className="font-bold text-sky-dim bg-sky-dim/10 px-2.5 py-1 rounded-lg">{count} kejadian ➔</span>
                               </div>
                           ))}
                           {sortedClasses.length === 0 && <div className="text-xs text-slate-400 py-2">Belum ada data pada periode ini.</div>}
                       </div>
                   </div>

                   {category === 'terlambat' && (
                       <div className="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm space-y-3">
                           <h3 className="text-xs font-display font-bold text-crimson uppercase">⚠ Siswa Sering Terlambat ($\ge3\times$)</h3>
                           {frequentStudents.length === 0 ? (
                               <div className="text-xs text-slate-400 py-2">Tidak ada siswa terlambat 3x atau lebih.</div>
                           ) : (
                               <div className="space-y-2">
                                   {frequentStudents.map((st, i) => (
                                       <div key={i} className="bg-crimson/5 border border-crimson/20 p-3 rounded-xl flex items-center justify-between">
                                           <div><div className="font-bold text-xs text-slate-900">{st.name}</div><div className="text-[10px] text-slate-500">{st.class} • <span className="font-bold text-crimson">{st.count}x</span></div></div>
                                           <Badge tone="crimson">Perlu Tindak Lanjut</Badge>
                                       </div>
                                   ))}
                               </div>
                           )}
                       </div>
                   )}

                   {canExport && (
                       <div className="grid grid-cols-2 gap-2 pt-2">
                           <button onClick={() => exportCSV(activeCat.data, activeCat.label)} className="bg-sky text-white py-2.5 rounded-xl text-xs font-bold">Unduh CSV</button>
                           <button onClick={() => window.print()} className="bg-slate-100 border text-slate-800 py-2.5 rounded-xl text-xs font-bold">Cetak / PDF</button>
                       </div>
                   )}

                   {selectedClassDetail && (
                       <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                           <div className="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl space-y-4 animate-pop max-h-[80vh] flex flex-col">
                               <div className="flex justify-between items-center border-b pb-3">
                                   <div className="font-display font-bold text-sm text-slate-900">Daftar Kelas {selectedClassDetail.cls}</div>
                                   <button onClick={() => setSelectedClassDetail(null)} className="text-xs font-bold text-slate-400">✕ Tutup</button>
                               </div>
                               <div className="overflow-y-auto space-y-2 flex-1 pr-1">
                                   {selectedClassDetail.items.map((it, i) => {
                                       const dt = parseTimestamp(it.timestamp);
                                       return (
                                           <div key={i} className="bg-slate-50 border border-slate-200 p-2.5 rounded-xl text-xs space-y-1">
                                               <div className="font-bold text-slate-900">{it.name}</div>
                                               <div className="text-[10px] text-slate-500 flex justify-between">
                                                   <span>{it.type || it.jenis_pelanggaran || it.jenis}</span>
                                                   <span>{dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}</span>
                                               </div>
                                           </div>
                                       );
                                   })}
                               </div>
                           </div>
                       </div>
                   )}
               </div>
           );
       }

       function PelanggaranTab({ students, onAddPelanggaran }) {
           const [searchQuery, setSearchQuery] = useState('');
           const [selectedStudent, setSelectedStudent] = useState(null);
           const [jenis, setJenis] = useState('');
           const [sanksi, setSanksi] = useState('');
           const [catatan, setCatatan] = useState('');
           const [msg, setMsg] = useState('');

           const filtered = searchQuery.trim() === '' ? [] : students.filter(s => s.name.toLowerCase().includes(searchQuery.toLowerCase()));

           const submitPelanggaran = () => {
               onAddPelanggaran({ nisn: selectedStudent.nisn, name: selectedStudent.name, class_name: selectedStudent.class, jenis_pelanggaran: jenis, sanksi, catatan }, (ok, text) => {
                   setMsg(text); setTimeout(() => setMsg(''), 3000);
               });
               setSelectedStudent(null); setSearchQuery(''); setJenis(''); setSanksi(''); setCatatan('');
           };

           return (
               <div className="space-y-5 animate-rise">
                   <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Catat Pelanggaran</h2>
                   {msg && <div className="text-xs text-sky-dim text-center bg-sky-dim/15 py-2 rounded-lg">{msg}</div>}
                   <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Cari nama siswa..." className="w-full bg-white border-2 border-slate-200 rounded-2xl px-4 py-3 text-sm shadow-sm" />
                   {searchQuery.trim() !== '' && (
                       <div className="bg-white rounded-2xl border border-slate-200 max-h-48 overflow-y-auto">
                           {filtered.map(s => (
                               <div key={s.nisn} onClick={() => { setSelectedStudent(s); setSearchQuery(''); }} className="px-4 py-3 border-b hover:bg-slate-50 cursor-pointer text-xs font-semibold">{s.name} ({s.class})</div>
                           ))}
                       </div>
                   )}
                   {selectedStudent && (
                       <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                           <div className="bg-white w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl animate-pop">
                               <div className="font-bold text-base text-center">{selectedStudent.name}</div>
                               <input type="text" value={jenis} onChange={(e) => setJenis(e.target.value)} placeholder="Jenis Pelanggaran..." className="w-full border p-2.5 rounded-xl text-xs" />
                               <input type="text" value={sanksi} onChange={(e) => setSanksi(e.target.value)} placeholder="Sanksi..." className="w-full border p-2.5 rounded-xl text-xs" />
                               <input type="text" value={catatan} onChange={(e) => setCatatan(e.target.value)} placeholder="Catatan (opsional)..." className="w-full border p-2.5 rounded-xl text-xs" />
                               <button onClick={submitPelanggaran} className="w-full bg-sky text-white py-2.5 rounded-xl text-xs font-bold">Simpan</button>
                               <button onClick={() => setSelectedStudent(null)} className="w-full border py-2 rounded-xl text-xs text-slate-500">Batal</button>
                           </div>
                       </div>
                   )}
               </div>
           );
       }

       function BimbinganTab({ bimbinganList, onUpdateStatus }) {
           return (
               <div className="space-y-5 animate-rise">
                   <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Bimbingan Khusus</h2>
                   <div className="space-y-2.5">
                       {bimbinganList.map((b, idx) => {
                           const isDone = b.status === 'selesai';
                           return (
                               <div key={idx} className={`bg-white border p-3.5 rounded-xl space-y-2 ${isDone ? 'border-emerald-200 bg-emerald-50/20' : 'border-slate-200'}`}>
                                   <div className="flex items-center justify-between">
                                       <div className="font-semibold text-sm">{b.name} ({b.class})</div>
                                       {isDone ? <Badge tone="green">Selesai</Badge> : <Badge tone="crimson">Belum</Badge>}
                                   </div>
                                   <div className="text-[11px] text-slate-600">{b.catatan}</div>
                                   <button onClick={() => onUpdateStatus(b.id || idx, isDone ? 'belum' : 'selesai')} className="text-[10px] font-semibold bg-slate-100 border px-3 py-1.5 rounded-lg">
                                       {isDone ? 'Tandai Belum' : 'Tandai Sudah Ditindaklanjuti'}
                                   </button>
                               </div>
                           );
                       })}
                       {bimbinganList.length === 0 && <EmptyState emoji="🤝" text="Belum ada catatan bimbingan." />}
                   </div>
               </div>
           );
       }

       function KelolaTab({ teachers, onToggleStatus }) {
           return (
               <div className="space-y-5 animate-rise">
                   <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Kelola Guru</h2>
                   <div className="bg-white border rounded-2xl p-4 space-y-2.5">
                       {teachers.map(t => {
                           const isActive = t.status !== 'nonaktif';
                           return (
                               <div key={t.id} className="flex items-center justify-between border-b pb-2">
                                   <div>
                                       <div className="text-xs font-semibold">{t.name} {!isActive && <Badge tone="crimson">Nonaktif</Badge>}</div>
                                       <div className="text-[10px] text-slate-400">{t.id} • {t.role}</div>
                                   </div>
                                   <button onClick={() => onToggleStatus(t.id, isActive ? 'nonaktif' : 'aktif')} className={`text-[10px] font-semibold px-2.5 py-1.5 rounded-lg border ${isActive ? 'bg-crimson/10 text-crimson border-crimson/30' : 'bg-emerald-50 text-emerald-700 border-emerald-200'}`}>
                                       {isActive ? 'Nonaktifkan' : 'Aktifkan'}
                                   </button>
                               </div>
                           );
                       })}
                   </div>
               </div>
           );
       }

       function RecordModal({ student, customReason, setCustomReason, onRecord, onClose }) {
           return (
               <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
                   <div className="bg-white w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl animate-pop">
                       <div className="text-center font-display text-lg font-bold">{student.name}</div>
                       <button onClick={() => onRecord('Terlambat bangun')} className="w-full bg-slate-100 py-3 rounded-xl text-xs font-semibold">⏰ Telat Bangun</button>
                       <button onClick={() => onRecord('Hujan')} className="w-full bg-slate-100 py-3 rounded-xl text-xs font-semibold">🌧️ Hujan</button>
                       <div className="flex gap-2">
                           <input type="text" value={customReason} onChange={(e) => setCustomReason(e.target.value)} placeholder="Alasan lain..." className="flex-1 border rounded-xl px-3 py-2 text-xs" />
                           <button onClick={() => onRecord('Custom')} disabled={!customReason.trim()} className="bg-sky text-white px-4 py-2 rounded-xl text-xs font-bold">Simpan</button>
                       </div>
                       <button onClick={onClose} className="w-full border py-2.5 rounded-xl text-xs font-bold text-slate-500">Batal</button>
                   </div>
               </div>
           );
       }

       function App() {
           const [user, setUser] = useState(null);
           const [sessionToken, setSessionToken] = useState(null);
           const [passwordInput, setPasswordInput] = useState('');
           const [loadingLogin, setLoadingLogin] = useState(false);
           const [loginError, setLoginError] = useState('');
           const [activeTab, setActiveTab] = useState('scan');
           const [selectedStudent, setSelectedStudent] = useState(null);
           const [customReasonInput, setCustomReasonInput] = useState('');
           const [toast, setToast] = useState(null);

           const [students, setStudents] = useState([]);
           const [allLogs, setAllLogs] = useState([]);
           const [pelanggaranList, setPelanggaranList] = useState([]);
           const [suratList, setSuratList] = useState([]);
           const [bimbinganList, setBimbinganList] = useState([]);
           const [teachers, setTeachers] = useState([]);

           const roleKey = user && ROLES[String(user.role).toLowerCase().trim()] ? String(user.role).toLowerCase().trim() : 'guru';
           const roleConfig = ROLES[roleKey];

           const fetchData = () => {
               fetch(`${API_URL}?action=getStudents&token=${API_TOKEN}&sessionToken=${sessionToken}`).then(res => res.json()).then(d => { if (d.status === 'success') setStudents(d.students); }).catch(() => {});
               fetch(`${API_URL}?action=getLogs&token=${API_TOKEN}&sessionToken=${sessionToken}`).then(res => res.json()).then(d => { if (d.status === 'success') setAllLogs(d.logs); }).catch(() => {});
               fetch(`${API_URL}?action=getSurat&token=${API_TOKEN}&sessionToken=${sessionToken}`).then(res => res.json()).then(d => { if (d.status === 'success') setSuratList(d.surat); }).catch(() => {});
               fetch(`${API_URL}?action=getPelanggaran&token=${API_TOKEN}&sessionToken=${sessionToken}`).then(res => res.json()).then(d => { if (d.status === 'success') setPelanggaranList(d.pelanggaran); }).catch(() => {});
               if (roleKey === 'admin') fetch(`${API_URL}?action=getTeachers&token=${API_TOKEN}&sessionToken=${sessionToken}`).then(res => res.json()).then(d => { if (d.status === 'success') setTeachers(d.teachers); }).catch(() => {});
               if (roleKey === 'admin' || roleKey === 'bk_kesiswaan') fetch(`${API_URL}?action=getBimbingan&token=${API_TOKEN}&sessionToken=${sessionToken}`).then(res => res.json()).then(d => { if (d.status === 'success') setBimbinganList(d.bimbingan); }).catch(() => {});
           };

           useEffect(() => { if (user) { setActiveTab(roleConfig.menus[0]); fetchData(); } }, [user]);

           const handleLogin = (e) => {
               e.preventDefault();
               setLoadingLogin(true);
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', password: passwordInput, token: API_TOKEN }) })
                   .then(res => res.json())
                   .then(data => {
                       setLoadingLogin(false);
                       if (data.status === 'success') { setUser(data.user); setSessionToken(data.sessionToken); }
                       else setLoginError(data.message || 'Password salah!');
                   }).catch(() => { setLoadingLogin(false); setLoginError('Koneksi Gagal.'); });
           };

           const handleRecord = (type) => {
               if (!navigator.onLine) { setToast('Koneksi terputus! Data gagal disimpan.'); setTimeout(() => setToast(null), 4000); return; }
               const finalType = type === 'Custom' ? (customReasonInput.trim() || 'Lainnya') : type;
               const newEntry = { timestamp: new Date(), nisn: selectedStudent.nisn, name: selectedStudent.name, class: selectedStudent.class, type: finalType, logged_by: user.name };
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'record', nisn: selectedStudent.nisn, name: selectedStudent.name, class_name: selectedStudent.class, type: finalType, sessionToken, token: API_TOKEN }) })
                   .then(res => res.json())
                   .then(d => { if (d.status === 'success') setAllLogs(prev => [newEntry, ...prev]); });
               setToast(`Berhasil mencatat: ${selectedStudent.name}`);
               setSelectedStudent(null); setCustomReasonInput('');
               setTimeout(() => setToast(null), 3000);
           };

           const handleAddSurat = (payload, callback) => {
               if (!navigator.onLine) { callback(false, 'Koneksi terputus!'); return; }
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addSurat', token: API_TOKEN, sessionToken, ...payload }) })
                   .then(res => res.json())
                   .then(data => {
                       if (data.status === 'success') {
                           setSuratList(prev => [{ timestamp: new Date(), nisn: payload.nisn, name: payload.name, class: payload.class_name, jenis: payload.jenis, keterangan: payload.keterangan || '', logged_by: user.name }, ...prev]);
                           callback(true, 'Surat berhasil dicatat.');
                       } else callback(false, 'Gagal mencatat surat.');
                   }).catch(() => callback(false, 'Koneksi gagal.'));
           };

           const handleDeleteLog = (payload, callback) => {
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteLog', sessionToken, token: API_TOKEN, ...payload }) })
                   .then(res => res.json())
                   .then(data => {
                       if (data.status === 'success') {
                           if (payload.category === 'terlambat') setAllLogs(prev => prev.filter(l => (l.id || l.timestamp) !== payload.id));
                           if (payload.category === 'pelanggaran') setPelanggaranList(prev => prev.filter(p => (p.id || p.timestamp) !== payload.id));
                           if (payload.category === 'surat') setSuratList(prev => prev.filter(s => (s.id || s.timestamp) !== payload.id));
                           callback(true, 'Catatan berhasil dihapus.');
                       } else callback(false, 'Gagal menghapus.');
                   }).catch(() => callback(false, 'Koneksi gagal.'));
           };

           const handleAddPelanggaran = (payload, callback) => {
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addPelanggaran', token: API_TOKEN, sessionToken, ...payload }) })
                   .then(res => res.json())
                   .then(data => {
                       if (data.status === 'success') {
                           setPelanggaranList(prev => [{ timestamp: new Date(), nisn: payload.nisn, name: payload.name, class: payload.class_name, jenis_pelanggaran: payload.jenis_pelanggaran, sanksi: payload.sanksi, catatan: payload.catatan || '', logged_by: user.name }, ...prev]);
                           callback(true, 'Pelanggaran berhasil dicatat.');
                       } else callback(false, 'Gagal mencatat.');
                   }).catch(() => callback(false, 'Koneksi gagal.'));
           };

           const handleToggleTeacherStatus = (targetId, newStatus) => {
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'toggleTeacherStatus', sessionToken, token: API_TOKEN, targetId, status: newStatus }) })
                   .then(res => res.json())
                   .then(data => { if (data.status === 'success') setTeachers(prev => prev.map(t => t.id === targetId ? { ...t, status: newStatus } : t)); }).catch(() => {});
           };

           return (
               <div>
                   {!user ? (
                       <LoginScreen onLogin={handleLogin} loading={loadingLogin} error={loginError} password={passwordInput} setPassword={setPasswordInput} />
                   ) : (
                       <div className="min-h-screen bg-slate-100 text-slate-900 relative">
                           <Header user={user} roleLabel={roleConfig.label} onLogout={() => { setUser(null); setSessionToken(null); }} />
                           {toast && (
                               <div className="fixed bottom-24 inset-x-0 z-50 px-4">
                                   <div className="max-w-2xl mx-auto bg-sky text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between">{toast}</div>
                               </div>
                           )}
                           <div className="max-w-2xl mx-auto px-4 pt-20 pb-24">
                               {activeTab === 'scan' && <GerbangTab students={students} onSelectLate={setSelectedStudent} onAddSurat={handleAddSurat} />}
                               {activeTab === 'dashboard' && <DashboardTab allLogs={allLogs} pelanggaranList={pelanggaranList} suratList={suratList} onRefresh={fetchData} />}
                               {activeTab === 'log' && <LogTab allLogs={allLogs} pelanggaranList={pelanggaranList} suratList={suratList} onDeleteLog={handleDeleteLog} />}
                               {activeTab === 'stats' && <StatsTab allLogs={allLogs} pelanggaranList={pelanggaranList} suratList={suratList} canExport={roleConfig.canExport} />}
                               {activeTab === 'pelanggaran' && <PelanggaranTab students={students} onAddPelanggaran={handleAddPelanggaran} />}
                               {activeTab === 'bimbingan' && <BimbinganTab bimbinganList={bimbinganList} onUpdateStatus={(id, st) => setBimbinganList(prev => prev.map((b, i) => (b.id === id || i === id) ? { ...b, status: st } : b))} />}
                               {activeTab === 'kelola' && <KelolaTab teachers={teachers} onToggleStatus={handleToggleTeacherStatus} />}
                           </div>
                           {selectedStudent && <RecordModal student={selectedStudent} customReason={customReasonInput} setCustomReason={setCustomReasonInput} onRecord={handleRecord} onClose={() => setSelectedStudent(null)} />}
                           <BottomNav menus={roleConfig.menus} primaryMenus={roleConfig.primaryMenus} activeTab={activeTab} setActiveTab={setActiveTab} />
                       </div>
                   )}
               </div>
           );
       }

       ReactDOM.createRoot(document.getElementById('root')).render(<App />);
   </script>
</body>
</html>
