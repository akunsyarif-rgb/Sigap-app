<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGAP - Sistem Informasi Gerbang & Absensi Pelanggaran</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen m-0 font-sans">

    <div id="root" class="w-full h-screen sm:h-[844px] sm:max-w-[390px] sm:rounded-[40px] sm:border-[8px] sm:border-gray-800 bg-gray-900 flex flex-col overflow-hidden shadow-2xl relative"></div>

    <script type="text/babel">
        // ⚠️ PASTIKAN LINK INI SESUAI DENGAN WEB APP GOOGLE SCRIPT ANDA
        const API_URL = "https://script.google.com/macros/s/AKfycbxMh_A5xbwfff7GwgojVLyCRXjpl2FyyTSIf8HvkTxOx4w6zasLZ9VDhMNraEux1tAztg/exec";

        function App() {
            const [user, setUser] = React.useState(null);
            const [passwordInput, setPasswordInput] = React.useState('');
            const [loadingLogin, setLoadingLogin] = React.useState(false);
            const [loginError, setLoginError] = React.useState('');

            const [activeTab, setActiveTab] = React.useState('scan');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [selectedStudent, setSelectedStudent] = React.useState(null);
            const [customReasonInput, setCustomReasonInput] = React.useState('');
            const [toast, setToast] = React.useState(null);
            const [students, setStudents] = React.useState([]);
            const [records, setRecords] = React.useState([]);

            React.useEffect(() => {
                if (user) {
                    fetch(`${API_URL}?action=getStudents`)
                        .then(res => res.json())
                        .then(data => {
                            if (data.status === 'success') {
                                setStudents(data.students);
                            }
                        })
                        .catch(err => console.error("Gagal memuat data siswa:", err));
                }
            }, [user]);

            const handleLogin = (e) => {
                e.preventDefault();
                setLoadingLogin(true);
                setLoginError('');

                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', password: passwordInput })
                })
                .then(res => res.json())
                .then(data => {
                    setLoadingLogin(false);
                    if (data.status === 'success') {
                        setUser(data.user);
                    } else {
                        setLoginError(data.message || 'Password salah!');
                    }
                })
                .catch(err => {
                    setLoadingLogin(false);
                    setLoginError('Koneksi Gagal. Coba lagi.');
                });
            };

            const filteredStudents = searchQuery.trim() === '' ? [] : students.filter(s => 
                s.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                s.class.toLowerCase().includes(searchQuery.toLowerCase())
            );

            // Menghitung berapa kali siswa ini tercatat terlambat hari ini
            const getLateCount = (nisn) => {
                return records.filter(r => r.nisn === nisn && r.type === 'Terlambat bangun').length;
            };

            const handleRecord = (type) => {
                const now = new Date();
                const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                const finalType = type === 'Custom' ? (customReasonInput.trim() || 'Lainnya') : type;

                const payload = {
                    action: 'record',
                    nisn: selectedStudent.nisn,
                    name: selectedStudent.name,
                    class_name: selectedStudent.class,
                    type: finalType,
                    logged_by: user.name
                };

                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                }).catch(err => console.error("Gagal simpan ke sheets:", err));

                const newEntry = {
                    id: Date.now().toString(),
                    nisn: selectedStudent.nisn,
                    name: selectedStudent.name,
                    class: selectedStudent.class,
                    time: timeString,
                    type: finalType,
                    logged_by: user.name
                };

                setRecords([newEntry, ...records]);
                setToast(`Berhasil: ${selectedStudent.name} (${finalType})`);
                setSelectedStudent(null);
                setSearchQuery('');
                setCustomReasonInput('');

                setTimeout(() => setToast(null), 3000);
            };

            if (!user) {
                return (
                    <div className="flex flex-col h-full justify-center p-6 bg-gray-900 text-gray-100">
                        <div className="text-center mb-8">
                            <div className="w-16 h-16 bg-emerald-600/20 border border-emerald-500 rounded-2xl mx-auto flex items-center justify-center text-3xl mb-3 shadow-inner">🏫</div>
                            <h1 className="text-2xl font-bold text-emerald-400">SIGAP</h1>
                            <p className="text-xs text-gray-400 mt-1">Sistem Informasi Gerbang & Absensi Pelanggaran</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4 bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
                            <div>
                                <label className="text-xs text-gray-400 font-medium mb-1 block">Password Guru (contoh: budi2026):</label>
                                <input 
                                    type="password"
                                    value={passwordInput}
                                    onChange={(e) => setPasswordInput(e.target.value)}
                                    placeholder="Masukkan password..."
                                    className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition"
                                    required
                                />
                            </div>

                            {loginError && <div className="text-xs text-rose-400 font-medium text-center">{loginError}</div>}

                            <button 
                                type="submit"
                                disabled={loadingLogin}
                                className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-semibold text-sm shadow transition active:scale-95 disabled:opacity-50"
                            >
                                {loadingLogin ? 'Memeriksa...' : 'Masuk Aplikasi'}
                            </button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full bg-gray-900 text-gray-100 relative select-none">
                    
                    {/* Header dengan Branding Sekolah */}
                    <div className="bg-gray-800 px-4 py-3 flex items-center justify-between border-b border-gray-700">
                        <div className="flex items-center space-x-3">
                            <div className="w-9 h-9 bg-emerald-600/20 border border-emerald-500 rounded-xl flex items-center justify-center text-lg">🏫</div>
                            <div>
                                <h1 className="font-bold text-xs uppercase tracking-wider text-emerald-400">SMA Negeri 1 (SIGAP)</h1>
                                <p className="text-[10px] text-gray-400">Petugas: <span className="text-white font-medium">{user.name}</span></p>
                            </div>
                        </div>
                        <button 
                            onClick={() => setUser(null)}
                            className="text-[10px] bg-gray-700 hover:bg-gray-600 text-gray-300 px-2.5 py-1.5 rounded-lg border border-gray-600 transition"
                        >
                            Keluar
                        </button>
                    </div>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="absolute top-16 left-4 right-4 z-50 bg-emerald-600 text-white text-xs px-4 py-3 rounded-xl shadow-lg flex items-center justify-between animate-bounce">
                            <span>{toast}</span>
                            <span className="font-bold bg-emerald-700 px-2 py-0.5 rounded">OK</span>
                        </div>
                    )}

                    {/* Konten Utama */}
                    <div className="flex-1 overflow-y-auto p-4 pb-20">
                        {activeTab === 'scan' ? (
                            <div className="space-y-4">
                                <div className="bg-gray-800 border-2 border-dashed border-gray-600 rounded-2xl p-4 flex flex-col items-center justify-center relative">
                                    <div className="w-48 h-32 border-2 border-emerald-500 rounded-xl flex items-center justify-center relative overflow-hidden bg-gray-900/50 shadow-inner">
                                        <div className="absolute inset-x-0 h-0.5 bg-emerald-400 animate-pulse top-1/2"></div>
                                        <span className="text-xs text-gray-400 text-center px-2">Arahkan kartu siswa ke area kotak</span>
                                    </div>
                                    {students.length > 0 && (
                                        <button 
                                            onClick={() => setSelectedStudent(students[0])}
                                            className="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow transition active:scale-95"
                                        >
                                            ⚡ Simulasi Scan ({students[0].name})
                                        </button>
                                    )}
                                </div>

                                <div>
                                    <label className="text-xs text-gray-400 font-medium mb-1 block">Cari Nama / Kelas Siswa:</label>
                                    <input 
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Ketik nama siswa..."
                                        className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 transition"
                                    />
                                </div>

                                {searchQuery.trim() !== '' && (
                                    <div className="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden shadow-lg">
                                        <div className="px-3 py-2 bg-gray-750 border-b border-gray-700 text-xs text-gray-400 font-medium">
                                            Hasil Pencarian ({filteredStudents.length})
                                        </div>
                                        {filteredStudents.length > 0 ? (
                                            filteredStudents.map(student => (
                                                <div 
                                                    key={student.nisn}
                                                    onClick={() => setSelectedStudent(student)}
                                                    className="px-4 py-3 border-b border-gray-700/50 flex items-center justify-between hover:bg-gray-750 active:bg-gray-700 cursor-pointer transition"
                                                >
                                                    <div>
                                                        <div className="font-semibold text-sm text-white">{student.name}</div>
                                                        <div className="text-xs text-gray-400">{student.class} • NISN: {student.nisn}</div>
                                                    </div>
                                                    <span className="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-1 rounded-lg font-medium">Pilih</span>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="p-4 text-center text-xs text-gray-500">Siswa tidak ditemukan</div>
                                        )}
                                    </div>
                                )}
                            </div>
                        ) : (
                            <div className="space-y-3">
                                <h2 className="text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Riwayat Tercatat Hari Ini</h2>
                                {records.length > 0 ? (
                                    records.map(rec => (
                                        <div key={rec.id} className="bg-gray-800 border border-gray-700 p-3.5 rounded-xl shadow space-y-1">
                                            <div className="flex items-center justify-between">
                                                <div className="font-semibold text-sm text-white">{rec.name}</div>
                                                <span className="text-[10px] bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded-full font-medium">
                                                    {rec.type}
                                                </span>
                                            </div>
                                            <div className="text-[11px] text-gray-400 flex justify-between">
                                                <span>{rec.class} • Pukul {rec.time}</span>
                                                <span className="italic text-emerald-400">Petugas: {rec.logged_by}</span>
                                            </div>
                                        </div>
                                    ))
                                ) : (
                                    <div className="text-center py-12 text-gray-500 text-xs">Belum ada data tercatat pada sesi ini.</div>
                                )}
                            </div>
                        )}
                    </div>

                    {/* Modal Konfirmasi dengan 4 Core Alasan + Peringatan 3x & Manual Input */}
                    {selectedStudent && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-gray-800 w-full sm:max-w-sm rounded-t-3xl sm:rounded-2xl p-5 border border-gray-700 shadow-2xl space-y-3 animate-in">
                                <div className="text-center">
                                    <div className="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-2 sm:hidden"></div>
                                    <h3 className="text-[11px] text-emerald-400 uppercase tracking-wider font-semibold">Pilih Keterangan Alasan</h3>
                                    <div className="text-lg font-bold text-white mt-0.5">{selectedStudent.name}</div>
                                    <div className="text-xs text-gray-400">{selectedStudent.class}</div>
                                    
                                    {/* Indikator Peringatan jika sudah sering terlambat */}
                                    {getLateCount(selectedStudent.nisn) >= 2 && (
                                        <div className="mt-2 bg-rose-950/80 border border-rose-600 text-rose-300 text-[11px] px-3 py-1.5 rounded-lg font-medium animate-pulse">
                                            ⚠️ PERINGATAN: Siswa ini sudah sering terlambat!
                                        </div>
                                    )}
                                </div>

                                {/* 4 Core Alasan Utama Baru */}
                                <div className="grid grid-cols-2 gap-2">
                                    <button 
                                        onClick={() => handleRecord('Terlambat bangun')}
                                        className="bg-amber-600 hover:bg-amber-500 text-white py-2.5 px-2 rounded-xl font-semibold text-xs shadow transition active:scale-95 text-center"
                                    >
                                        ⏰ Terlambat bangun
                                    </button>
                                    <button 
                                        onClick={() => handleRecord('Hujan')}
                                        className="bg-blue-600 hover:bg-blue-500 text-white py-2.5 px-2 rounded-xl font-semibold text-xs shadow transition active:scale-95 text-center"
                                    >
                                        🌧️ Hujan
                                    </button>
                                    <button 
                                        onClick={() => handleRecord('Kendaraan bermasalah')}
                                        className="bg-purple-600 hover:bg-purple-500 text-white py-2.5 px-2 rounded-xl font-semibold text-xs shadow transition active:scale-95 text-center"
                                    >
                                        🏍️ Kendaraan bermasalah
                                    </button>
                                    <button 
                                        onClick={() => handleRecord('Keperluan mengantar org tua/saudara')}
                                        className="bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 px-2 rounded-xl font-semibold text-xs shadow transition active:scale-95 text-center text-[11px]"
                                    >
                                        👥 Mengantar keluarga
                                    </button>
                                </div>

                                {/* Input Manual Alasan Lain */}
                                <div className="pt-1 border-t border-gray-700">
                                    <label className="text-[10px] text-gray-400 font-medium mb-1 block">Atau Ketik Alasan Lainnya:</label>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text"
                                            value={customReasonInput}
                                            onChange={(e) => setCustomReasonInput(e.target.value)}
                                            placeholder="Tulis alasan khusus..."
                                            className="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                                        />
                                        <button 
                                            onClick={() => handleRecord('Custom')}
                                            disabled={!customReasonInput.trim()}
                                            className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white px-3 py-2 rounded-xl text-xs font-semibold transition"
                                        >
                                            Simpan
                                        </button>
                                    </div>
                                </div>

                                <button 
                                    onClick={() => setSelectedStudent(null)}
                                    className="w-full bg-gray-700 hover:bg-gray-600 text-gray-300 py-2 rounded-xl font-medium text-xs transition"
                                >
                                    Batal
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Bottom Nav */}
                    <div className="absolute bottom-0 inset-x-0 bg-gray-800 border-t border-gray-700 flex justify-around py-3 px-6 z-40">
                        <button 
                            onClick={() => setActiveTab('scan')}
                            className={`flex flex-col items-center space-y-1 transition ${activeTab === 'scan' ? 'text-emerald-400' : 'text-gray-400'}`}
                        >
                            <span className="text-lg">⚡</span>
                            <span className="text-[10px] font-medium">Gerbang / Scan</span>
                        </button>
                        <button 
                            onClick={() => setActiveTab('history')}
                            className={`flex flex-col items-center space-y-1 transition ${activeTab === 'history' ? 'text-emerald-400' : 'text-gray-400'}`}
                        >
                            <span className="text-lg">📋</span>
                            <span className="text-[10px] font-medium">Riwayat Sesi Ini</span>
                        </button>
                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
