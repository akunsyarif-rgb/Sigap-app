<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Prototipe SIGAP UX</title>
  
  <!-- Memuat React, ReactDOM, dan Tailwind dari CDN untuk pengujian instan -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-800 flex items-center justify-center min-h-screen">

  <!-- Tempat Aplikasi Dirender -->
  <div id="root" class="w-full h-screen sm:h-[800px] sm:max-w-md sm:rounded-[2.5rem] sm:border-[8px] border-black overflow-hidden shadow-2xl relative"></div>

  <!-- Kode Aplikasi SIGAP -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- MOCK DATA ---
    const mockStudents = [
      { id: 'S01', nis: '1001', name: 'Fachri', class: 'X MIPA 1' },
      { id: 'S02', nis: '1002', name: 'Budi Santoso', class: 'X MIPA 1' },
      { id: 'S03', nis: '1003', name: 'Siti Aminah', class: 'XI IPS 2' },
      { id: 'S04', nis: '1004', name: 'Fakhri', class: 'XII IPA 3' }
    ];

    const mockReasons = [
      { id: 'R1', label: 'Kesiangan', isDefault: true },
      { id: 'R2', label: 'Ban Bocor / Kendaraan', isDefault: false },
      { id: 'R3', label: 'Hujan / Cuaca', isDefault: false },
    ];

    function SigapApp() {
      const [searchQuery, setSearchQuery] = useState('');
      const [searchResults, setSearchResults] = useState([]);
      
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [selectedReason, setSelectedReason] = useState(mockReasons.find(r => r.isDefault).id);
      const [isDuplicateError, setIsDuplicateError] = useState(false);
      const [toast, setToast] = useState({ show: false, message: '' });

      // Efek Pencarian (Smart Search)
      useEffect(() => {
        if (searchQuery.trim().length > 0) {
          const lowerQuery = searchQuery.toLowerCase();
          const results = mockStudents.filter(s => 
            s.name.toLowerCase().includes(lowerQuery) || 
            s.class.toLowerCase().includes(lowerQuery) ||
            s.nis.includes(lowerQuery)
          );
          setSearchResults(results);
        } else {
          setSearchResults([]);
        }
      }, [searchQuery]);

      const handleSelectStudent = (student, isDuplicate = false) => {
        setSearchQuery('');
        setSearchResults([]);
        if (document.activeElement) document.activeElement.blur();
        
        setSelectedStudent(student);
        setIsDuplicateError(isDuplicate);
        setSelectedReason(mockReasons.find(r => r.isDefault).id);
      };

      const handleSave = () => {
        const studentName = selectedStudent.name;
        const studentClass = selectedStudent.class;
        
        setSelectedStudent(null);
        setToast({ show: true, message: `${studentName} (${studentClass}) dicatat.` });
        
        setTimeout(() => setToast({ show: false, message: '' }), 5000);
      };

      return (
        <div className="w-full h-full bg-gray-100 relative flex flex-col font-sans">
          
          {/* HEADER: Smart Search */}
          <div className="bg-white px-4 py-3 pb-4 shadow-sm z-20">
            <h1 className="text-xl font-extrabold text-blue-700 mb-3 tracking-tight">SIGAP.</h1>
            <div className="relative">
              <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <svg className="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
              </div>
              <input
                type="text"
                className="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-xl leading-5 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white text-base transition h-12"
                placeholder="Cari Nama, NIS, atau Kelas..."
                value={searchQuery}
                onChange={(e) => setSearchQuery(e.target.value)}
              />
            </div>

            {/* Dropdown Pencarian */}
            {searchResults.length > 0 && (
              <div className="absolute top-28 left-4 right-4 bg-white shadow-xl rounded-xl border border-gray-100 max-h-60 overflow-y-auto mt-2">
                {searchResults.map((student) => (
                  <div 
                    key={student.id} 
                    className="p-4 border-b border-gray-50 hover:bg-blue-50 cursor-pointer"
                    onClick={() => handleSelectStudent(student)}
                  >
                    <div className="font-bold text-lg text-gray-900">{student.name}</div>
                    <div className="text-sm text-gray-500">{student.class} • NIS: {student.nis}</div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* BODY: Simulasi Kamera Scanner */}
          <div className="flex-1 bg-black relative flex flex-col items-center justify-center">
            <div className="w-64 h-64 border-2 border-white/30 rounded-2xl relative">
              <div className="absolute top-0 left-0 right-0 h-1 bg-green-500 shadow-[0_0_10px_#22c55e] animate-bounce"></div>
            </div>
            <p className="text-white/60 mt-6 text-sm">Arahkan kartu siswa ke area kotak</p>

            <div className="absolute bottom-10 flex gap-2 w-full px-4">
              <button 
                onClick={() => handleSelectStudent(mockStudents[0], false)}
                className="flex-1 bg-gray-800 text-white py-3 rounded-xl text-sm border border-gray-600 font-semibold"
              >
                + Simulasi Scan
              </button>
              <button 
                onClick={() => handleSelectStudent(mockStudents[1], true)}
                className="flex-1 bg-gray-800 text-red-400 py-3 rounded-xl text-sm border border-red-900 font-semibold"
              >
                + Error Ganda
              </button>
            </div>
          </div>

          {/* OVERLAY */}
          {selectedStudent && (
            <div className="absolute inset-0 bg-black/60 z-30 transition-opacity" onClick={() => setSelectedStudent(null)} />
          )}

          {/* BOTTOM SHEET */}
          <div className={`absolute bottom-0 left-0 right-0 bg-white rounded-t-2xl shadow-2xl z-40 transform transition-transform duration-200 ${selectedStudent ? 'translate-y-0' : 'translate-y-full'}`}>
            <div className="flex justify-center pt-3 pb-2">
              <div className="w-12 h-1.5 bg-gray-300 rounded-full" />
            </div>

            {selectedStudent && (
              <div className="px-6 pb-6 pt-2">
                {isDuplicateError && (
                  <div className="bg-red-50 text-red-700 p-3 rounded-xl mb-4 font-bold text-center border border-red-200 text-sm">
                    ⚠️ Siswa sudah dicatat pukul 07:12
                  </div>
                )}

                <div className="flex flex-col items-center mb-6">
                  <div className="w-16 h-16 bg-gray-100 rounded-full mb-3 flex items-center justify-center text-gray-500 text-2xl font-bold border border-gray-200">
                    {selectedStudent.name.charAt(0)}
                  </div>
                  <h2 className="text-2xl font-bold text-gray-900 text-center">{selectedStudent.name}</h2>
                  <p className="text-lg text-gray-500">{selectedStudent.class}</p>
                </div>

                {!isDuplicateError && (
                  <div className="mb-6">
                    <p className="text-sm font-semibold text-gray-500 mb-3">Alasan Keterlambatan:</p>
                    <div className="flex flex-wrap gap-2">
                      {mockReasons.map(reason => (
                        <button
                          key={reason.id}
                          onClick={() => setSelectedReason(reason.id)}
                          className={`px-4 py-2 h-12 rounded-xl text-sm font-medium border ${
                            selectedReason === reason.id
                              ? 'bg-blue-600 text-white border-blue-600 shadow-md'
                              : 'bg-white text-gray-700 border-gray-300'
                          }`}
                        >
                          {reason.label}
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {isDuplicateError ? (
                  <button onClick={() => setSelectedStudent(null)} className="w-full h-14 bg-gray-200 text-gray-800 rounded-xl font-bold text-lg">
                    TUTUP
                  </button>
                ) : (
                  <button onClick={handleSave} className="w-full h-14 bg-blue-600 text-white rounded-xl font-bold text-lg shadow-lg active:scale-95 transition-transform">
                    SIMPAN (1 TAP)
                  </button>
                )}
              </div>
            )}
          </div>

          {/* TOAST UNDO */}
          <div className={`absolute bottom-6 left-4 right-4 bg-green-800 text-white px-4 py-4 rounded-xl shadow-xl z-50 flex items-center justify-between transform transition-all duration-300 ${toast.show ? 'translate-y-0 opacity-100' : 'translate-y-20 opacity-0'}`}>
            <div className="text-sm font-medium">{toast.message}</div>
            <button onClick={() => setToast({ show: false, message: '' })} className="text-yellow-400 font-bold text-sm bg-green-900/50 px-3 py-1.5 rounded-lg">
              BATAL
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SigapApp />);
  </script>
</body>
</html>
