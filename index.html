       function Icon({ path, className = "h-5 w-5", filled = false }) {
           return (
               <svg xmlns="http://www.w3.org/2000/svg" className={className} fill={filled ? 'currentColor' : 'none'} viewBox="0 0 24 24" stroke="currentColor" strokeWidth={filled ? 0 : 1.6}>
                   {path}
               </svg>
           );
       }

       function parseTimestamp(ts) {
           if (!ts) return new Date();
           if (typeof ts === 'string') {
               if (ts.includes('/')) {
                   const parts = ts.trim().split(' ');
                   const dateParts = parts[0].split('/');
                   if (dateParts.length === 3) {
                       const day = dateParts[0].padStart(2, '0');
                       const month = dateParts[1].padStart(2, '0');
                       const year = dateParts[2];
                       const timePart = parts[1] ? parts[1] + (parts[1].split(':').length === 2 ? ':00' : '') : '00:00:00';
                       const formatted = `${year}-${month}-${day}T${timePart}`;
                       const d = new Date(formatted);
                       if (!isNaN(d.getTime())) return d;
                   }
               }
           }
           const fallback = new Date(ts);
           return isNaN(fallback.getTime()) ? new Date() : fallback;
       }

       const isSameDay = (a, b) => a.toDateString() === b.toDateString();
       const startOfWeek = (d) => { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); x.setHours(0,0,0,0); return x; };
       const startOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);

       function getSemesterInfo(d) {
           const m = d.getMonth();
           if (m >= 6) return { label: 'Semester Ganjil', months: [6,7,8,9,10,11], year: d.getFullYear() };
           return { label: 'Semester Genap', months: [0,1,2,3,4,5], year: d.getFullYear() };
       }

       function inRange(ts, start, end) { const t = parseTimestamp(ts).getTime(); return t >= start.getTime() && t <= end.getTime(); }

       function countInRange(logs, start, end) {
           return logs.filter(l => inRange(l.timestamp, start, end)).length;
       }

       function topN(logs, keyFn, n = 3) {
           const map = {};
           logs.forEach(l => { const k = keyFn(l) || '—'; map[k] = (map[k] || 0) + 1; });
           return Object.entries(map).sort((a, b) => b[1] - a[1]).slice(0, n).map(([label, count]) => ({ label, count }));
       }

       function buildPeriodSeries(period, logs) {
           const now = new Date();
           if (period === '5hari') {
               const days = [];
               let cursor = new Date(now);
               while (days.length < 5) {
                   if (cursor.getDay() !== 0 && cursor.getDay() !== 6) days.unshift(new Date(cursor));
                   cursor.setDate(cursor.getDate() - 1);
               }
               return days.map(d => ({ 
                   label: d.toLocaleDateString('id-ID', { weekday: 'short' }), 
                   dateStr: d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }),
                   count: logs.filter(l => isSameDay(parseTimestamp(l.timestamp), d)).length 
               }));
           }
           if (period === 'mingguan') {
               const start = startOfWeek(now);
               return Array.from({ length: 7 }, (_, i) => {
                   const d = new Date(start); d.setDate(start.getDate() + i);
                   return { 
                       label: d.toLocaleDateString('id-ID', { weekday: 'short' }), 
                       dateStr: d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' }),
                       count: logs.filter(l => isSameDay(parseTimestamp(l.timestamp), d)).length 
                   };
               });
           }
           if (period === 'bulanan') {
               const start = startOfMonth(now);
               const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
               const weeks = Math.ceil(daysInMonth / 7);
               return Array.from({ length: weeks }, (_, i) => {
                   const wStart = new Date(start); wStart.setDate(start.getDate() + i * 7);
                   const wEnd = new Date(wStart); wEnd.setDate(wStart.getDate() + 6); wEnd.setHours(23,59,59,999);
                   return { label: `M${i + 1}`, dateStr: `${wStart.getDate()}-${wEnd.getDate()}`, count: countInRange(logs, wStart, wEnd) };
               });
           }
           if (period === 'semester') {
               const info = getSemesterInfo(now);
               return info.months.map(m => {
                   const s = new Date(info.year, m, 1); const e = new Date(info.year, m + 1, 0, 23, 59, 59, 999);
                   return { label: s.toLocaleDateString('id-ID', { month: 'short' }), count: countInRange(logs, s, e) };
               });
           }
           return Array.from({ length: 12 }, (_, m) => {
               const s = new Date(now.getFullYear(), m, 1); const e = new Date(now.getFullYear(), m + 1, 0, 23, 59, 59, 999);
               return { label: s.toLocaleDateString('id-ID', { month: 'short' }), count: countInRange(logs, s, e) };
           });
       }

       function exportCSV(logs, filenameHint) {
           const header = ['Nama', 'NISN', 'Kelas', 'Alasan', 'Tanggal', 'Waktu', 'Dicatat Oleh'];
           const rows = logs.map(l => {
               const dt = parseTimestamp(l.timestamp);
               return [
                   l.name, l.nisn || '', l.class, l.type,
                   dt.toLocaleDateString('id-ID'),
                   dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }),
                   l.logged_by || '',
               ];
           });
           const csv = [header, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
           const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
           const url = URL.createObjectURL(blob);
           const a = document.createElement('a');
           a.href = url; a.download = `SIGAP_${filenameHint}_${new Date().toISOString().slice(0, 10)}.csv`;
           document.body.appendChild(a); a.click(); document.body.removeChild(a);
           URL.revokeObjectURL(url);
       }

                               <span className="text-[9px] text-slate-600 mt-2 font-bold">{d.label}</span>

           return (

                   {showMore && secondaryMenus.length > 0 && (

                               {secondaryMenus.map(key => {

       function KelolaTab({ teachers, onAddTeacher, onUpdatePassword, loading }) {
           const [newId, setNewId] = useState('');
           const [newName, setNewName] = useState('');
           const [newPassword, setNewPassword] = useState('');
           const [newRole, setNewRole] = useState('guru_piket');
           const [resetTarget, setResetTarget] = useState(null);
           const [resetPassword, setResetPassword] = useState('');
           const [msg, setMsg] = useState('');
           const [msgTone, setMsgTone] = useState('sky');

           const showMsg = (ok, text) => {
               setMsgTone(ok ? 'sky' : 'crimson');
               setMsg(text);
               setTimeout(() => setMsg(''), 3000);
           };

           const submitAdd = (e) => {
               e.preventDefault();
               if (!newId.trim() || !newName.trim() || !newPassword.trim()) return;
               onAddTeacher({ newId: newId.trim(), newName: newName.trim(), newPassword: newPassword.trim(), newRole }, (ok, text) => {
                   showMsg(ok, text);
                   if (ok) { setNewId(''); setNewName(''); setNewPassword(''); setNewRole('guru_piket'); }
               });
           };

           const submitReset = () => {
               if (!resetPassword.trim() || !resetTarget) return;
               onUpdatePassword({ targetId: resetTarget.id, newPassword: resetPassword.trim() }, (ok, text) => {
                   showMsg(ok, text);
                   setResetTarget(null); setResetPassword('');
               });
           };

           return (
               <div className="space-y-5 animate-rise">
                   <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Kelola Guru</h2>

                   {msg && (
                       <div className={`text-xs font-medium text-center py-2 rounded-lg border ${msgTone === 'sky' ? 'text-sky-dim bg-sky-dim/15 border-sky-dim/40' : 'text-crimson bg-crimson/10 border-crimson/30'}`}>
                           {msg}
                       </div>
                   )}

                   <form onSubmit={submitAdd} className="bg-white border border-slate-200 rounded-2xl p-4 space-y-3">
                       <h3 className="text-xs font-display font-bold text-slate-800">Tambah Guru Baru</h3>
                       <input type="text" value={newId} onChange={(e) => setNewId(e.target.value)} placeholder="ID Guru (contoh: G21)" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-sky" required />
                       <input type="text" value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="Nama Lengkap" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-sky" required />
                       <input type="text" value={newPassword} onChange={(e) => setNewPassword(e.target.value)} placeholder="Password Awal" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-sky" required />
                       <select value={newRole} onChange={(e) => setNewRole(e.target.value)} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-sky">
                           <option value="guru_piket">Guru</option>
                           <option value="admin">Admin</option>
                       </select>
                       <button type="submit" disabled={loading} className="w-full bg-sky hover:bg-sky-light text-white py-2.5 rounded-xl text-xs font-bold transition disabled:opacity-50">
                           {loading ? 'Menyimpan...' : 'Tambah Guru'}
                       </button>
                   </form>

                   <div className="bg-white border border-slate-200 rounded-2xl p-4">
                       <h3 className="text-xs font-display font-bold text-slate-800 mb-3">Daftar Guru ({teachers.length})</h3>
                       {teachers.length === 0 && <div className="text-xs text-slate-400 py-2">Memuat daftar guru...</div>}
                       <div className="space-y-2">
                           {teachers.map(t => (
                               <div key={t.id} className="flex items-center justify-between bg-white/60 rounded-xl px-3 py-2.5">
                                   <div className="min-w-0">
                                       <div className="text-xs font-semibold text-slate-900 truncate">{t.name}</div>
                                       <div className="text-[10px] text-slate-400">{t.id} • {t.role === 'admin' ? 'Admin' : 'Guru'}</div>
                                   </div>
                                   <button onClick={() => setResetTarget(t)} className="text-[10px] font-semibold bg-slate-100 border border-slate-300 text-slate-600 px-2.5 py-1.5 rounded-lg flex-shrink-0">Reset Password</button>
                               </div>
                           ))}
                       </div>
                   </div>

                   {resetTarget && (
                       <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                           <div className="bg-white w-full max-w-sm rounded-3xl p-6 border border-slate-200 shadow-2xl space-y-4 animate-pop">
                               <div className="text-center">
                                   <h3 className="text-[10px] text-sky-dim uppercase tracking-widest font-bold">Reset Password</h3>
                                   <div className="font-display text-lg font-extrabold text-slate-900 mt-1">{resetTarget.name}</div>
                               </div>
                               <input type="text" value={resetPassword} onChange={(e) => setResetPassword(e.target.value)} placeholder="Password baru" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-sky" />
                               <button onClick={submitReset} className="w-full bg-sky hover:bg-sky-light text-white py-2.5 rounded-xl text-xs font-bold transition">Simpan Password Baru</button>
                               <button onClick={() => { setResetTarget(null); setResetPassword(''); }} className="w-full bg-transparent border-2 border-slate-300 text-slate-500 py-2.5 rounded-2xl font-bold text-xs">Batal</button>
                           </div>
                       </div>
                   )}
               </div>
           );
       }

       function SummaryCard({ value, label, tone }) {
           const toneClasses = {
               crimson: 'bg-crimson/10 border-crimson/30 text-crimson',

               <div className={`p-4 rounded-2xl text-center border ${toneClasses[tone]}`}>

       function DashboardTab({ allLogs, pelanggaranList, suratList, onRefresh, loading }) {
           const now = new Date();
           const todayLate = allLogs.filter(l => isSameDay(parseTimestamp(l.timestamp), now));
           const todayPelanggaran = pelanggaranList.filter(p => isSameDay(parseTimestamp(p.timestamp), now));
           const todaySurat = suratList.filter(s => isSameDay(parseTimestamp(s.timestamp), now));

           // Hanya aktivitas HARI INI — untuk data lebih lama, arahkan ke menu Riwayat
           const combinedFeed = [
               ...todayLate.map(l => ({ ...l, _kind: 'terlambat', _time: parseTimestamp(l.timestamp) })),
               ...todayPelanggaran.map(p => ({ ...p, _kind: 'pelanggaran', _time: parseTimestamp(p.timestamp) })),
               ...todaySurat.map(s => ({ ...s, _kind: 'surat', _time: parseTimestamp(s.timestamp) })),
           ].sort((a, b) => b._time - a._time);

           return (
               <div className="space-y-5 animate-rise">
                   <div className="flex justify-between items-end">
                       <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Ringkasan Hari Ini</h2>
                       <button onClick={onRefresh} className="text-[10px] text-sky-dim font-semibold bg-sky-dim/10 px-2 py-1 rounded-md">Refresh</button>
                   </div>

                   <div className="grid grid-cols-3 gap-2.5">
                       <SummaryCard value={todayLate.length} label="Terlambat" tone="crimson" />
                       <SummaryCard value={todaySurat.length} label="Surat" tone="sky" />

                   <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Aktivitas Hari Ini</h2>

                   {loading ? (
                       <div className="text-center py-10 text-xs text-slate-400">Memuat data...</div>
                   ) : combinedFeed.length > 0 ? (
                       <div className="space-y-2.5">
                           {combinedFeed.map((item, idx) => <FeedItem key={idx} item={item} />)}
                       </div>
                   ) : (
                       <EmptyState emoji="🏆" text="Belum ada aktivitas tercatat hari ini." />
                   )}

                   <p className="text-[11px] text-slate-400 text-center pt-1">Untuk data kemarin, minggu, atau bulan lalu, buka menu <span className="font-semibold text-slate-500">Riwayat</span>.</p>
               </div>
           );
       }

       function LogTab({ allLogs, pelanggaranList, suratList, initialCategory }) {
           const [category, setCategory] = useState(initialCategory || 'terlambat');
           const [period, setPeriod] = useState('semua');
           const [customDate, setCustomDate] = useState('');
           const [filterClass, setFilterClass] = useState('');
           const [filterSub, setFilterSub] = useState('');
           const [search, setSearch] = useState('');
           const [expandedStudent, setExpandedStudent] = useState(null);
           const [showFilters, setShowFilters] = useState(false);

           const periods = [
               { key: 'semua', label: 'Semua' },
               { key: 'hari-ini', label: 'Hari Ini' },
               { key: 'kemarin', label: 'Kemarin' },
               { key: 'minggu-ini', label: 'Minggu Ini' },
               { key: 'bulan-ini', label: 'Bulan Ini' },
           ];

           const categories = [
               { key: 'terlambat', label: 'Terlambat', data: allLogs, subField: 'type', subLabel: 'Alasan' },
               { key: 'pelanggaran', label: 'Pelanggaran', data: pelanggaranList, subField: 'jenis_pelanggaran', subLabel: 'Jenis' },
               { key: 'surat', label: 'Surat', data: suratList, subField: 'jenis', subLabel: 'Jenis' },
           ];
           const activeCat = categories.find(c => c.key === category);
           const sourceData = activeCat.data;

           // Ganti kategori = reset filter, supaya tidak ada filter nyangkut dari kategori sebelumnya
           useEffect(() => { setFilterClass(''); setFilterSub(''); setPeriod('semua'); setCustomDate(''); setExpandedStudent(null); }, [category]);

           const classes = useMemo(() => [...new Set(sourceData.map(l => l.class))].sort(), [sourceData]);
           const subOptions = useMemo(() => [...new Set(sourceData.map(l => l[activeCat.subField]))].filter(Boolean).sort(), [sourceData, category]);

           const passesPeriod = (dt) => {
               const now = new Date();
               if (period === 'hari-ini') return isSameDay(dt, now);
               if (period === 'kemarin') {
                   const y = new Date(now); y.setDate(now.getDate() - 1);
                   return isSameDay(dt, y);
               }
               if (period === 'minggu-ini') return dt >= startOfWeek(now) && dt <= now;
               if (period === 'bulan-ini') return dt >= startOfMonth(now) && dt <= now;
               if (period === 'custom' && customDate) return isSameDay(dt, new Date(customDate));
               return true;
           };

           const filtered = sourceData.filter(l => {
               const dt = parseTimestamp(l.timestamp);
               if (!passesPeriod(dt)) return false;
               if (filterClass && l.class !== filterClass) return false;
               if (filterSub && l[activeCat.subField] !== filterSub) return false;
               if (search.trim() && !l.name.toLowerCase().includes(search.toLowerCase()) && !(l.nisn && l.nisn.toString().includes(search.trim()))) return false;
               return true;
           }).sort((a, b) => parseTimestamp(b.timestamp) - parseTimestamp(a.timestamp));

           const activeFilterCount = [filterClass, filterSub, period !== 'semua' ? 'x' : ''].filter(Boolean).length;

           return (
               <div className="space-y-4 animate-rise">
                   <div className="grid grid-cols-3 gap-2 bg-white border border-slate-200 rounded-2xl p-1.5">
                       {categories.map(c => (
                           <button key={c.key} onClick={() => setCategory(c.key)} className={`py-2 rounded-xl text-xs font-bold transition ${category === c.key ? 'bg-sky text-white shadow-md' : 'text-slate-500'}`}>{c.label}</button>
                       ))}
                   </div>

                   <div className="flex gap-1.5 overflow-x-auto pb-1">
                       {periods.map(p => (
                           <button key={p.key} onClick={() => { setPeriod(p.key); setCustomDate(''); }} className={`px-3.5 py-1.5 rounded-xl text-[11px] font-bold whitespace-nowrap transition ${period === p.key ? 'bg-navy text-white' : 'bg-white text-slate-500 border border-slate-200'}`}>
                               {p.label}
                           </button>
                       ))}
                   </div>

                   <div className="flex gap-2">
                       <div className="relative flex-1">
                           <input type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Cari nama atau NISN siswa..." className="w-full bg-white border-2 border-slate-200 rounded-2xl px-4 py-2.5 text-sm text-slate-900 focus:outline-none focus:border-sky" />
                           <Icon path={<path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />} className="h-4 w-4 absolute right-4 top-3 text-slate-400" />
                       </div>
                       <button onClick={() => setShowFilters(v => !v)} className={`px-3.5 rounded-2xl border flex items-center gap-1 text-xs font-semibold transition ${(filterClass || filterSub) ? 'bg-sky-dim/25 border-sky-dim text-sky-dim' : 'bg-white border-slate-200 text-slate-500'}`}>
                           <Icon path={<path strokeLinecap="round" strokeLinejoin="round" d="M6 4.5h12M6 4.5a1.5 1.5 0 00-1.5 1.5v.879a1.5 1.5 0 00.44 1.06l4.12 4.122a1.5 1.5 0 01.44 1.06v4.502a1.5 1.5 0 00.732 1.286l2.25 1.353a.75.75 0 001.128-.647V13.12a1.5 1.5 0 01.44-1.06l4.12-4.122a1.5 1.5 0 00.44-1.06V6A1.5 1.5 0 0018 4.5" />} className="h-4 w-4" />
                           {(filterClass || filterSub) && <span>•</span>}
                       </button>
                   </div>

                   {showFilters && (
                       <div className="bg-white border border-slate-200 rounded-2xl p-4 space-y-3 animate-pop">
                           <div>
                               <label className="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 block">Kelas</label>
                               <select value={filterClass} onChange={(e) => setFilterClass(e.target.value)} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-sky">
                                   <option value="">Semua Kelas</option>
                                   {classes.map(c => <option key={c} value={c}>{c}</option>)}
                               </select>
                           </div>
                           <div>
                               <label className="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 block">{activeCat.subLabel}</label>
                               <select value={filterSub} onChange={(e) => setFilterSub(e.target.value)} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-sky">
                                   <option value="">Semua {activeCat.subLabel}</option>
                                   {subOptions.map(r => <option key={r} value={r}>{r}</option>)}
                               </select>
                           </div>
                           <div>
                               <label className="text-[10px] text-slate-500 font-bold uppercase tracking-wider mb-1 block">Tanggal Spesifik</label>
                               <input type="date" value={customDate} onChange={(e) => { setCustomDate(e.target.value); setPeriod('custom'); }} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-sky" />
                           </div>
                           {(filterClass || filterSub || period !== 'semua') && (
                               <button onClick={() => { setFilterClass(''); setFilterSub(''); setPeriod('semua'); setCustomDate(''); }} className="text-[10px] text-crimson font-semibold">Reset semua filter</button>
                           )}
                       </div>
                   )}

                   <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">{filtered.length} catatan {activeCat.label.toLowerCase()}</h2>

                   {filtered.length > 0 ? (
                       <div className="space-y-2.5">
                           {filtered.map((item, idx) => {
                               const dt = parseTimestamp(item.timestamp);
                               const subValue = item[activeCat.subField];
                               return (
                                   <div key={idx}>
                                       <div onClick={() => setExpandedStudent(expandedStudent === item.nisn ? null : item.nisn)} className="bg-white border border-slate-200 p-3.5 rounded-xl space-y-1 cursor-pointer active:bg-slate-100 transition">
                                           <div className="flex items-center justify-between">
                                               <div className="font-semibold text-sm text-slate-900">{item.name}</div>
                                               <span className="text-[9px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full font-semibold">{subValue}</span>
                                           </div>
                                           <div className="text-[10px] text-slate-400 flex justify-between">
                                               <span>{item.class} • {dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                                               <span>{dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</span>
                                           </div>
                                           {category === 'pelanggaran' && item.sanksi && (
                                               <div className="text-[10px] text-slate-500">Sanksi: {item.sanksi}</div>
                                           )}
                                           {category === 'surat' && item.foto_url && (
                                               <a href={item.foto_url} target="_blank" rel="noreferrer" onClick={(e) => e.stopPropagation()} className="text-[10px] text-sky-dim underline inline-block">Lihat foto surat</a>
                                           )}
                                       </div>
                                       {expandedStudent === item.nisn && (
                                           <div className="ml-3 mt-1.5 mb-1 pl-3 border-l-2 border-sky-dim space-y-1.5 animate-pop">
                                               <div className="text-[10px] text-slate-400 font-semibold uppercase tracking-wide">Riwayat {activeCat.label} {item.name}</div>
                                               {sourceData.filter(l => l.nisn === item.nisn).map((h, i) => {
                                                   const hDt = parseTimestamp(h.timestamp);
                                                   return (
                                                       <div key={i} className="text-[11px] text-slate-500 flex justify-between bg-slate-50 rounded-lg px-2.5 py-1.5">
                                                           <span>{h[activeCat.subField]}</span>
                                                           <span>{hDt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}</span>
                                                       </div>
                                                   );
                                               })}
                                           </div>
                                       )}
                                   </div>
                               );
                           })}
                       </div>
                   ) : (
                       <EmptyState emoji="🔍" text={`Tidak ada catatan ${activeCat.label.toLowerCase()} yang cocok.`} />
                   )}
               </div>
           );
       }

       function StatsTab({ allLogs, canExport }) {
           const [period, setPeriod] = useState('5hari');
           const periods = [
               { key: '5hari', label: '5 Hari' },
               { key: 'mingguan', label: 'Mingguan' },
               { key: 'bulanan', label: 'Bulanan' },
               { key: 'semester', label: 'Semester' },
               { key: 'tahunan', label: 'Tahunan' },
           ];
           const series = buildPeriodSeries(period, allLogs);

           const periodLogs = allLogs.filter(l => {
               const dt = parseTimestamp(l.timestamp);
               const now = new Date();
               if (period === '5hari') {
                   const past = new Date();
                   past.setDate(now.getDate() - 5);
                   return dt >= past && dt <= now;
               }
               if (period === 'mingguan') {
                   return inRange(l.timestamp, startOfWeek(now), now);
               }
               if (period === 'bulanan') {
                   return inRange(l.timestamp, startOfMonth(now), now);
               }
               if (period === 'semester') {
                   const semInfo = getSemesterInfo(now);
                   const s = new Date(semInfo.year, semInfo.months[0], 1);
                   return inRange(l.timestamp, s, now);
               }
               const s = new Date(now.getFullYear(), 0, 1);
               return inRange(l.timestamp, s, now);
           });

           return (
               <div className="space-y-5 animate-rise">
                   <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Statistik Keterlambatan</h2>

                   <div className="flex gap-1.5 overflow-x-auto pb-1">
                       {periods.map(p => (

       function GerbangTab({ students, onSelectLate, suratList, onAddSurat, onDeleteSurat, isAdminUser }) {

           const [fotoPreview, setFotoPreview] = useState(null);
           const [fotoBase64, setFotoBase64] = useState(null);
           const [showDeletePanel, setShowDeletePanel] = useState(false);
           const [delMonth, setDelMonth] = useState(String(new Date().getMonth() + 1));
           const [delYear, setDelYear] = useState(String(new Date().getFullYear()));
           const [msg, setMsg] = useState('');
           const [savingSurat, setSavingSurat] = useState(false);
           const fileInputRef = useRef(null);

           const filtered = searchQuery.trim() === '' ? [] : students.filter(s =>
               s.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
               s.class.toLowerCase().includes(searchQuery.toLowerCase()) ||
               (s.nisn && s.nisn.toString().includes(searchQuery.trim()))
           );

           const showMsg = (text) => { setMsg(text); setTimeout(() => setMsg(''), 3000); };

           const handleSelect = (s) => {
               setSearchQuery('');
               if (mode === 'terlambat') {
                   onSelectLate(s);
               } else {
                   setSuratStudent(s);
               }
           };

           // Kompres foto di sisi browser (maks lebar 800px, kualitas 60%) sebelum
           // dikirim, supaya ukuran data tetap kecil dan tidak membebani penyimpanan.
           const handleFotoChange = (e) => {
               const file = e.target.files[0];
               if (!file) return;
               const reader = new FileReader();
               reader.onload = (ev) => {
                   const img = new Image();
                   img.onload = () => {
                       const maxWidth = 800;
                       const scale = Math.min(1, maxWidth / img.width);
                       const canvas = document.createElement('canvas');
                       canvas.width = img.width * scale;
                       canvas.height = img.height * scale;
                       const ctx = canvas.getContext('2d');
                       ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                       const compressed = canvas.toDataURL('image/jpeg', 0.6);
                       setFotoPreview(compressed);
                       setFotoBase64(compressed.split(',')[1]);
                   };
                   img.src = ev.target.result;
               };
               reader.readAsDataURL(file);
           };

           const submitSurat = () => {
               setSavingSurat(true);
               onAddSurat({ nisn: suratStudent.nisn, name: suratStudent.name, class_name: suratStudent.class, jenis, keterangan, fotoBase64 }, (ok, text) => {
                   setSavingSurat(false);
                   showMsg(text);
               });
               setSuratStudent(null); setJenis('Sakit'); setKeterangan(''); setFotoPreview(null); setFotoBase64(null);

               onDeleteSurat({ month: delMonth, year: delYear }, (ok, text) => showMsg(text));
               setShowDeletePanel(false);

               <div className="space-y-5 animate-rise">
                   <div className="grid grid-cols-2 gap-2 bg-white border border-slate-200 rounded-2xl p-1.5">

                       <button onClick={() => setMode('surat')} className={`py-2.5 rounded-xl text-xs font-bold transition ${mode === 'surat' ? 'bg-sky text-white shadow-md' : 'text-slate-500'}`}>Catat Surat</button>
                   </div>

                   {msg && <div className="text-xs text-sky-dim font-medium text-center bg-sky-dim/15 border border-sky-dim/40 py-2 rounded-lg">{msg}</div>}

                   <div>
                       <label className="text-xs text-slate-500 font-semibold mb-1.5 block">Cari Manual (Nama, Kelas, atau NISN)</label>
                       <div className="relative">

                           />
                           <Icon path={<path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />} className="h-5 w-5 absolute right-4 top-3.5 text-slate-400" />
                       </div>
                   </div>

                   {searchQuery.trim() !== '' && (
                       <div className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xl animate-rise">

                               Hasil ({filtered.length}) — mode: {mode === 'terlambat' ? 'Catat Terlambat' : 'Catat Surat'}
                           </div>
                           <div className="max-h-60 overflow-y-auto">
                               {filtered.length > 0 ? filtered.map(s => (
                                   <div key={s.nisn} onClick={() => handleSelect(s)} className="px-4 py-3.5 border-b border-slate-200/60 flex items-center justify-between hover:bg-slate-100 active:bg-slate-200 cursor-pointer transition">
                                       <div>
                                           <div className="font-bold text-sm text-slate-900">{s.name}</div>
                                           <div className="text-xs text-sky-dim font-medium mt-0.5">{s.class} <span className="text-slate-400 font-normal">| NISN: {s.nisn}</span></div>
                                       </div>
                                       <span className="text-xs bg-sky text-white px-3 py-1.5 rounded-lg font-semibold shadow-sm">Pilih</span>
                                   </div>
                               )) : <div className="p-6 text-center text-xs text-slate-400 font-medium">Siswa tidak ditemukan</div>}
                           </div>
                       </div>
                   )}

                   {mode === 'surat' && (
                       <React.Fragment>
                           {isAdminUser && (
                               <div className="bg-white border border-slate-200 rounded-2xl p-4 space-y-3">
                                   <button onClick={() => setShowDeletePanel(v => !v)} className="text-[10px] font-semibold text-crimson">Hapus Data per Bulan/Tahun</button>
                                   {showDeletePanel && (
                                       <div className="space-y-2 animate-pop">
                                           <div className="grid grid-cols-2 gap-2">
                                               <select value={delMonth} onChange={(e) => setDelMonth(e.target.value)} className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900">
                                                   {Array.from({ length: 12 }, (_, i) => <option key={i + 1} value={i + 1}>{new Date(2000, i).toLocaleDateString('id-ID', { month: 'long' })}</option>)}
                                               </select>
                                               <input type="number" value={delYear} onChange={(e) => setDelYear(e.target.value)} className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900" />
                                           </div>
                                           <button onClick={submitDelete} className="w-full bg-crimson hover:bg-crimson-dim text-white py-2.5 rounded-xl text-xs font-bold">Hapus Data Periode Ini</button>
                                       </div>
                                   )}
                               </div>
                           )}

                           <h3 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">{suratList.length} catatan surat</h3>
                           <div className="space-y-2.5">

                                               <div className="font-semibold text-sm text-slate-900">{s.name}</div>
                                               <span className="text-[9px] bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full font-semibold">{s.jenis}</span>
                                           </div>
                                           <div className="text-[10px] text-slate-400 flex justify-between gap-2">
                                               <span>{s.class} • {dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}</span>
                                               <span className="truncate">{s.keterangan}</span>
                                           </div>
                                           {s.foto_url && <a href={s.foto_url} target="_blank" rel="noreferrer" className="text-[10px] text-sky-dim underline">Lihat foto surat</a>}
                                       </div>
                                   );
                               })}
                               {suratList.length === 0 && <EmptyState emoji="✉️" text="Belum ada catatan surat masuk." />}
                           </div>
                       </React.Fragment>
                   )}

                   {suratStudent && (
                       <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">

                               <div className="text-center">
                                   <h3 className="text-[10px] text-sky-dim uppercase tracking-widest font-bold">Catat Surat Masuk</h3>
                                   <div className="font-display text-xl font-extrabold text-slate-900 mt-1">{suratStudent.name}</div>
                                   <div className="text-xs text-slate-500">{suratStudent.class}</div>

                                           <Icon path={<path strokeLinecap="round" strokeLinejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" />} className="h-4 w-4" />
                                           Foto Surat (Opsional)
                                       </button>
                                   )}
                               </div>

                               <button onClick={submitSurat} disabled={savingSurat} className="w-full bg-sky hover:bg-sky-light disabled:opacity-50 text-white py-3 rounded-2xl font-bold text-sm">

       function PelanggaranTab({ students, pelanggaranList, onAddPelanggaran, onAddBimbingan }) {

               (s.nisn && s.nisn.toString().includes(searchQuery.trim()))

               onAddPelanggaran({ nisn: selectedStudent.nisn, name: selectedStudent.name, class_name: selectedStudent.class, jenis_pelanggaran: finalJenis, sanksi: finalSanksi, catatan }, (ok, text) => showMsg(text));
               setSelectedStudent(null); setSearchQuery(''); setJenis(''); setJenisCustom(''); setSanksi(''); setSanksiCustom(''); setCatatan('');
           };

               onAddBimbingan({ nisn: bimbinganTarget.nisn, name: bimbinganTarget.name, class_name: bimbinganTarget.class, catatan: bimbinganCatatan.trim() }, (ok, text) => showMsg(text));

                                               <span className="text-[9px] bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded-full font-semibold flex-shrink-0">{p.jenis_pelanggaran}</span>
                                           </div>
                                           <div className="text-[10px] text-slate-400 flex justify-between gap-2">
                                               <span>{p.class} • Sanksi: {p.sanksi}</span>
                                               <span className="flex-shrink-0">{dt.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}</span>
                                           </div>
                                       </div>
                                   );
                               })}
                           </div>
                       ) : (
                           <EmptyState emoji="✅" text="Belum ada pelanggaran tercatat hari ini." />
                       )}
                       <p className="text-[11px] text-slate-400 text-center pt-3">Untuk data kemarin/minggu/bulan lalu, buka menu <span className="font-semibold text-slate-500">Riwayat</span>.</p>
                   </div>

                   {selectedStudent && (
                       <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 overflow-y-auto">
                           <div className="bg-white w-full sm:max-w-sm rounded-t-[32px] sm:rounded-3xl p-6 border border-slate-200 shadow-2xl space-y-4 animate-pop my-4">
                               <div className="text-center">
                                   <h3 className="text-[10px] text-sky-dim uppercase tracking-widest font-bold">Catat Pelanggaran</h3>
                                   <div className="font-display text-xl font-extrabold text-slate-900 mt-1">{selectedStudent.name}</div>
                                   <div className="text-xs text-slate-500">{selectedStudent.class}</div>
                               </div>

                               {studentHistory.length > 0 && (
                                   <div className="bg-crimson/10 border border-crimson/40 rounded-2xl p-3 space-y-1.5">
                                       <div className="text-[10px] text-crimson font-bold uppercase tracking-wide">⚠ Sudah {studentHistory.length}x tercatat sebelumnya</div>
                                       {studentHistory.slice(0, 3).map((h, i) => {
                                           const hDt = parseTimestamp(h.timestamp);
                                           return <div key={i} className="text-[11px] text-slate-600">{h.jenis_pelanggaran} — {hDt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })} ({h.sanksi})</div>;
                                       })}
                                   </div>
                               )}

                               <div>
                                   <label className="text-[10px] text-slate-500 font-bold uppercase mb-1.5 block">Jenis Pelanggaran</label>
                                   <div className="grid grid-cols-3 gap-2">
                                       {jenisPresets.map(j => (
                                           <button key={j} onClick={() => setJenis(j)} className={`py-2 rounded-xl text-[10px] font-bold ${jenis === j ? 'bg-sky text-white' : 'bg-slate-100 border border-slate-300 text-slate-600'}`}>{j}</button>
                                       ))}
                                   </div>
                                   <input type="text" value={jenisCustom} onChange={(e) => { setJenisCustom(e.target.value); setJenis('Custom'); }} placeholder="Atau ketik manual..." className="w-full mt-2 bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-sky" />
                               </div>

                               <div>
                                   <label className="text-[10px] text-slate-500 font-bold uppercase mb-1.5 block">Sanksi</label>
                                   <div className="grid grid-cols-3 gap-2">
                                       {sanksiPresets.map(s => (
                                           <button key={s} onClick={() => setSanksi(s)} className={`py-2 rounded-xl text-[10px] font-bold ${sanksi === s ? 'bg-sky text-white' : 'bg-slate-100 border border-slate-300 text-slate-600'}`}>{s}</button>
                                       ))}
                                   </div>
                                   <input type="text" value={sanksiCustom} onChange={(e) => { setSanksiCustom(e.target.value); setSanksi('Custom'); }} placeholder="Atau ketik manual..." className="w-full mt-2 bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-sky" />
                               </div>

                               <input type="text" value={catatan} onChange={(e) => setCatatan(e.target.value)} placeholder="Catatan tambahan (opsional)" className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-sky" />

                               <button onClick={submitPelanggaran} disabled={!jenis || !sanksi} className="w-full bg-sky hover:bg-sky-light disabled:opacity-40 text-white py-3 rounded-2xl font-bold text-sm">Simpan</button>
                               <button onClick={() => { setBimbinganTarget(selectedStudent); setSelectedStudent(null); }} className="w-full bg-slate-100 border border-slate-300 text-slate-600 py-2.5 rounded-2xl font-bold text-xs">Tandai Perlu Bimbingan Khusus</button>
                               <button onClick={() => setSelectedStudent(null)} className="w-full bg-transparent border-2 border-slate-300 text-slate-500 py-2.5 rounded-2xl font-bold text-xs">Batal</button>
                           </div>
                       </div>
                   )}

                   {bimbinganTarget && (
                       <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                           <div className="bg-white w-full max-w-sm rounded-3xl p-6 border border-slate-200 shadow-2xl space-y-4 animate-pop">
                               <div className="text-center">
                                   <h3 className="text-[10px] text-sky-dim uppercase tracking-widest font-bold">Perlu Bimbingan Khusus</h3>
                                   <div className="font-display text-lg font-extrabold text-slate-900 mt-1">{bimbinganTarget.name}</div>
                               </div>
                               <textarea value={bimbinganCatatan} onChange={(e) => setBimbinganCatatan(e.target.value)} placeholder="Catatan untuk Admin..." rows={3} className="w-full bg-white border border-slate-300 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-sky" />
                               <button onClick={submitBimbingan} className="w-full bg-sky hover:bg-sky-light text-white py-2.5 rounded-xl text-xs font-bold">Simpan (hanya Admin bisa lihat)</button>
                               <button onClick={() => { setBimbinganTarget(null); setBimbinganCatatan(''); }} className="w-full bg-transparent border-2 border-slate-300 text-slate-500 py-2.5 rounded-xl font-bold text-xs">Batal</button>
                           </div>
                       </div>
                   )}

                   <h3 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">{pelanggaranList.length} catatan pelanggaran</h3>
                   <div className="space-y-2.5">
                       {pelanggaranList.slice(0, 30).map((p, idx) => {
                           const dt = parseTimestamp(p.timestamp);
                           return (
                               <div key={idx} className="bg-white border border-slate-200 p-3.5 rounded-xl space-y-1">
                                   <div className="flex items-center justify-between">
                                       <div className="font-semibold text-sm text-slate-900">{p.name}</div>
                                       <span className="text-[9px] bg-crimson/15 text-crimson px-2 py-0.5 rounded-full font-semibold">{p.jenis_pelanggaran}</span>
                                   </div>
                                   <div className="text-[10px] text-slate-400 flex justify-between gap-2">
                                       <span>{p.class} • {dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })}</span>
                                       <span className="truncate">{p.sanksi}</span>
                                   </div>
                               </div>
                           );
                       })}
                       {pelanggaranList.length === 0 && <EmptyState emoji="📋" text="Belum ada catatan pelanggaran." />}
                   </div>
               </div>
           );
       }

       function BimbinganTab({ bimbinganList }) {
           return (
               <div className="space-y-5 animate-rise">
                   <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest">Perlu Bimbingan Khusus (Admin)</h2>
                   <p className="text-[11px] text-slate-400">Daftar ini hanya terlihat oleh Admin.</p>
                   <div className="space-y-2.5">
                       {bimbinganList.map((b, idx) => {
                           const dt = parseTimestamp(b.timestamp);
                           return (
                               <div key={idx} className="bg-white border border-slate-200 p-3.5 rounded-xl space-y-1.5">
                                   <div className="flex items-center justify-between">
                                       <div className="font-semibold text-sm text-slate-900">{b.name}</div>
                                       <span className="text-[10px] text-slate-400">{b.class}</span>
                                   </div>
                                   <div className="text-[11px] text-slate-600">{b.catatan}</div>
                                   <div className="text-[10px] text-slate-400 flex justify-between">
                                       <span>{dt.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}</span>
                                       <span>oleh {b.logged_by}</span>
                                   </div>
                               </div>
                           );
                       })}
                       {bimbinganList.length === 0 && <EmptyState emoji="🤝" text="Belum ada catatan bimbingan khusus." />}
                   </div>
               </div>
           );
       }

       function App() {
           const [user, setUser] = useState(null);
           const [passwordInput, setPasswordInput] = useState('');
           const [loadingLogin, setLoadingLogin] = useState(false);
           const [loginError, setLoginError] = useState('');

           const [activeTab, setActiveTab] = useState(null);
           const [fontScale, setFontScale] = useState(() => {
               try { return parseFloat(localStorage.getItem('sigap_font_scale')) || 1; } catch (e) { return 1; }
           });
           const FONT_SCALE_STEPS = [1, 1.15, 1.3, 1.45];
           const changeFontScale = (direction) => {
               const currentIndex = FONT_SCALE_STEPS.indexOf(fontScale);
               const idx = currentIndex === -1 ? 0 : currentIndex;
               const nextIndex = Math.min(FONT_SCALE_STEPS.length - 1, Math.max(0, idx + direction));
               const next = FONT_SCALE_STEPS[nextIndex];
               setFontScale(next);
               try { localStorage.setItem('sigap_font_scale', String(next)); } catch (e) {}
           };
           const [riwayatCategory, setRiwayatCategory] = useState('terlambat');
           const [selectedStudent, setSelectedStudent] = useState(null);
           const [customReasonInput, setCustomReasonInput] = useState('');
           const [toast, setToast] = useState(null);
           const [students, setStudents] = useState([]);
           const [allLogs, setAllLogs] = useState([]);
           const [loadingLogs, setLoadingLogs] = useState(false);

           const [teachers, setTeachers] = useState([]);
           const [loadingTeacherAction, setLoadingTeacherAction] = useState(false);
           const [suratList, setSuratList] = useState([]);
           const [pelanggaranList, setPelanggaranList] = useState([]);
           const [bimbinganList, setBimbinganList] = useState([]);

           // Cuma dua kemungkinan: 'admin' persis, atau dianggap 'guru' untuk selain itu
           const roleKey = user && user.role === 'admin' ? 'admin' : 'guru';
           const roleConfig = ROLES[roleKey];

           const fetchTeachers = () => {
               if (roleKey !== 'admin') return;
               fetch(`${API_URL}?action=getTeachers&token=${API_TOKEN}&requesterId=${user.id}`)
                   .then(res => res.json())
                   .then(data => { if (data.status === 'success') setTeachers(data.teachers); });
           };

           const fetchBimbingan = () => {
               if (roleKey !== 'admin') return;
               fetch(`${API_URL}?action=getBimbingan&token=${API_TOKEN}&requesterId=${user.id}`)
                   .then(res => res.json())
                   .then(data => { if (data.status === 'success') setBimbinganList(data.bimbingan); });
           };

           useEffect(() => {
               if (user) {
                   fetchData();
                   setActiveTab(roleConfig.menus[0]);
                   if (roleKey === 'admin') { fetchTeachers(); fetchBimbingan(); }
               }
           }, [user]);

           const fetchData = () => {
               setLoadingLogs(true);
               fetch(`${API_URL}?action=getStudents&token=${API_TOKEN}`).then(res => res.json()).then(data => { if (data.status === 'success') setStudents(data.students); });
               fetch(`${API_URL}?action=getLogs&token=${API_TOKEN}`).then(res => res.json()).then(data => {
                   if (data.status === 'success') setAllLogs(data.logs);
                   setLoadingLogs(false);
               }).catch(() => setLoadingLogs(false));
               fetch(`${API_URL}?action=getSurat&token=${API_TOKEN}`).then(res => res.json()).then(data => { if (data.status === 'success') setSuratList(data.surat); });
               fetch(`${API_URL}?action=getPelanggaran&token=${API_TOKEN}`).then(res => res.json()).then(data => { if (data.status === 'success') setPelanggaranList(data.pelanggaran); });
           };

           const handleLogin = (e) => {
               e.preventDefault();
               setLoadingLogin(true);
               setLoginError('');
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'login', password: passwordInput, token: API_TOKEN }) })
                   .then(res => res.json())
                   .then(data => {
                       setLoadingLogin(false);
                       if (data.status === 'success') setUser(data.user);
                       else setLoginError(data.message || 'Password salah!');
                   })
                   .catch(() => { setLoadingLogin(false); setLoginError('Koneksi Gagal. Coba lagi.'); });
           };

           const handleRecord = (type) => {
               const finalType = type === 'Custom' ? (customReasonInput.trim() || 'Lainnya') : type;
               const newEntry = { timestamp: new Date(), nisn: selectedStudent.nisn, name: selectedStudent.name, class: selectedStudent.class, type: finalType, logged_by: user.name };
               const payload = { action: 'record', nisn: selectedStudent.nisn, name: selectedStudent.name, class_name: selectedStudent.class, type: finalType, logged_by: user.name, token: API_TOKEN };
               fetch(API_URL, { method: 'POST', body: JSON.stringify(payload) })
                   .then(res => res.json())
                   .then(data => {
                       if (data.status === 'success') setAllLogs(prev => [newEntry, ...prev]);
                       else setToast('Gagal menyimpan, coba lagi.');
                   })
                   .catch(() => setToast('Koneksi gagal, coba lagi.'));
               setToast(`Berhasil mencatat: ${selectedStudent.name}`);
               setSelectedStudent(null); setCustomReasonInput('');
               setTimeout(() => setToast(null), 3000);
           };

           const handleAddTeacher = (payload, callback) => {
               setLoadingTeacherAction(true);
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addTeacher', requesterId: user.id, token: API_TOKEN, ...payload }) })
                   .then(res => res.json())
                   .then(data => {
                       setLoadingTeacherAction(false);
                       if (data.status === 'success') {
                           setTeachers(prev => [...prev, { id: payload.newId, name: payload.newName, role: payload.newRole }]);
                           callback(true, 'Guru berhasil ditambahkan.');
                       } else callback(false, data.message || 'Gagal menambah guru.');
                   })
                   .catch(() => { setLoadingTeacherAction(false); callback(false, 'Koneksi gagal, coba lagi.'); });
           };

           const handleUpdatePassword = (payload, callback) => {
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'updatePassword', requesterId: user.id, token: API_TOKEN, ...payload }) })
                   .then(res => res.json())
                   .then(data => {
                       if (data.status === 'success') callback(true, 'Password berhasil diubah.');
                       else callback(false, data.message || 'Gagal mengubah password.');
                   })
                   .catch(() => callback(false, 'Koneksi gagal, coba lagi.'));
           };

           const handleAddSurat = (payload, callback) => {
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addSurat', token: API_TOKEN, logged_by: user.name, ...payload }) })
                   .then(res => res.json())
                   .then(data => {
                       if (data.status === 'success') {
                           const newEntry = { timestamp: new Date(), nisn: payload.nisn, name: payload.name, class: payload.class_name, jenis: payload.jenis, keterangan: payload.keterangan || '', foto_url: data.fotoUrl || '', logged_by: user.name };
                           setSuratList(prev => [newEntry, ...prev]);
                           callback(true, 'Surat berhasil dicatat.');
                       } else callback(false, data.message || 'Gagal mencatat surat.');
                   })
                   .catch(() => callback(false, 'Koneksi gagal, coba lagi.'));
           };

           const handleDeleteSurat = (payload, callback) => {
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'deleteSurat', requesterId: user.id, token: API_TOKEN, ...payload }) })
                   .then(res => res.json())
                   .then(data => {
                       if (data.status === 'success') {
                           const month = parseInt(payload.month, 10);
                           const year = parseInt(payload.year, 10);
                           setSuratList(prev => prev.filter(s => {
                               const dt = parseTimestamp(s.timestamp);
                               return !((dt.getMonth() + 1) === month && dt.getFullYear() === year);
                           }));
                           callback(true, `Berhasil hapus ${data.deletedCount || 0} data.`);
                       } else callback(false, data.message || 'Gagal menghapus data.');
                   })
                   .catch(() => callback(false, 'Koneksi gagal, coba lagi.'));
           };

           const handleAddPelanggaran = (payload, callback) => {
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addPelanggaran', token: API_TOKEN, logged_by: user.name, ...payload }) })
                   .then(res => res.json())
                   .then(data => {
                       if (data.status === 'success') {
                           const newEntry = { timestamp: new Date(), nisn: payload.nisn, name: payload.name, class: payload.class_name, jenis_pelanggaran: payload.jenis_pelanggaran, sanksi: payload.sanksi, catatan: payload.catatan || '', logged_by: user.name };
                           setPelanggaranList(prev => [newEntry, ...prev]);
                           callback(true, 'Pelanggaran berhasil dicatat.');
                       } else callback(false, data.message || 'Gagal mencatat pelanggaran.');
                   })
                   .catch(() => callback(false, 'Koneksi gagal, coba lagi.'));
           };

           const handleAddBimbingan = (payload, callback) => {
               fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'addBimbingan', token: API_TOKEN, logged_by: user.name, ...payload }) })
                   .then(res => res.json())
                   .then(data => {
                       if (data.status === 'success') {
                           if (roleKey === 'admin') {
                               const newEntry = { timestamp: new Date(), nisn: payload.nisn, name: payload.name, class: payload.class_name, catatan: payload.catatan, logged_by: user.name };
                               setBimbinganList(prev => [newEntry, ...prev]);
                           }
                           callback(true, 'Berhasil dicatat (hanya Admin bisa lihat).');
                       } else callback(false, data.message || 'Gagal mencatat.');
                   })
                   .catch(() => callback(false, 'Koneksi gagal, coba lagi.'));
           };

           return (
               <div style={{ zoom: fontScale }}>
                   {!user ? (
                       <LoginScreen onLogin={handleLogin} loading={loadingLogin} error={loginError} password={passwordInput} setPassword={setPasswordInput} />
                   ) : (
                       <div className="min-h-screen bg-slate-100 text-slate-900 relative select-none">
                           <Header user={user} roleLabel={roleConfig.label} onLogout={() => setUser(null)} fontScale={fontScale} onFontScaleChange={changeFontScale} />

                           {toast && (
                               <div className="fixed bottom-24 inset-x-0 z-50 px-4">
                                   <div className="max-w-2xl mx-auto bg-sky text-white text-xs px-4 py-3 rounded-xl shadow-2xl flex items-center justify-between animate-pop border border-sky-light">
                                       <span>{toast}</span>
                                       <span className="font-bold bg-sky-dim px-2 py-1 rounded-lg">OK</span>
                                   </div>
                               </div>
                           )}

                           <div className="max-w-2xl mx-auto px-4 pt-20 pb-24">
                               {activeTab === 'scan' && roleConfig.menus.includes('scan') && (
                                   <GerbangTab students={students} onSelectLate={setSelectedStudent} suratList={suratList} onAddSurat={handleAddSurat} onDeleteSurat={handleDeleteSurat} isAdminUser={roleKey === 'admin'} />
                               )}
                               {activeTab === 'dashboard' && (
                                   <DashboardTab allLogs={allLogs} pelanggaranList={pelanggaranList} suratList={suratList} onRefresh={fetchData} loading={loadingLogs} />
                               )}
                               {activeTab === 'log' && roleConfig.menus.includes('log') && <LogTab allLogs={allLogs} pelanggaranList={pelanggaranList} suratList={suratList} initialCategory={riwayatCategory} />}
                               {activeTab === 'stats' && roleConfig.menus.includes('stats') && <StatsTab allLogs={allLogs} canExport={roleConfig.canExport} />}
                               {activeTab === 'kelola' && roleConfig.menus.includes('kelola') && (
                                   <KelolaTab teachers={teachers} onAddTeacher={handleAddTeacher} onUpdatePassword={handleUpdatePassword} loading={loadingTeacherAction} />
                               )}
                               {activeTab === 'pelanggaran' && roleConfig.menus.includes('pelanggaran') && (
                                   <PelanggaranTab students={students} pelanggaranList={pelanggaranList} onAddPelanggaran={handleAddPelanggaran} onAddBimbingan={handleAddBimbingan} />
                               )}
                               {activeTab === 'bimbingan' && roleConfig.menus.includes('bimbingan') && (
                                   <BimbinganTab bimbinganList={bimbinganList} />
                               )}
                           </div>

                           {selectedStudent && (
                               <RecordModal student={selectedStudent} customReason={customReasonInput} setCustomReason={setCustomReasonInput} onRecord={handleRecord} onClose={() => setSelectedStudent(null)} />
                           )}

                           <BottomNav menus={roleConfig.menus} primaryMenus={roleConfig.primaryMenus} activeTab={activeTab} setActiveTab={setActiveTab} />
                       </div>
                   )}
               </div>
           );
       }

       ReactDOM.createRoot(document.getElementById('root')).render(<App />);
   </script>
</body>
</html>
