<!DOCTYPE html>
<html lang="id">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
   <title>SIGAP - SMAN 2 Tarakan</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <!-- Fraunces (judul/angka besar) + Work Sans (UI/isi). Work Sans memuat
        500 juga (bukan cuma 400/600/700) karena font-extrabold (800) dipakai
        di beberapa angka statistik kecil di luar elemen font-display — lihat
        audit desain; menghapusnya akan mengubah tampilan tanpa menyentuh JSX. -->
   <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700;800&family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
   <!-- Build produksi (development.js sebelumnya): lebih kecil & tanpa
        console warning ala-dev yang tidak relevan buat end user. Tetap
        pin ke tag mayor "@18"/"@7" (bukan angka patch persis) supaya unpkg
        tidak pernah 404 kalau versi patch terbaru berubah, tapi tetap
        terkunci dari lompatan breaking-change React 19 / Babel 8. -->
   <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
   <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
   <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
   <script src="https://cdn.tailwindcss.com"></script>
   <script>
       // Palet "Modern Academic Utility" (audit desain Ags 2026). navy/sky/
       // crimson tetap nama token lama (dipakai ratusan kali di *.js sebagai
       // bg-sky-dim, text-crimson, dst.) — hanya nilai hex-nya yang diganti,
       // supaya efeknya langsung terasa tanpa menyentuh satu pun file JSX.
       // slate & amber JUGA di-override (bukan token baru) karena mayoritas
       // teks/border di app ini sebenarnya pakai warna Tailwind bawaan itu,
       // bukan token custom "ink" — override ini yang membuat latar jadi
       // "paper" hangat & teks jadi "ink" tanpa mengubah JSX. Semua rasio
       // kontras di bawah sudah dihitung terhadap latar paper (#F7F3EC),
       // bukan cuma putih — lihat catatan per baris.
       tailwind.config = {
           theme: {
               extend: {
                   fontFamily: {
                       sans: ['"Work Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                       display: ['Fraunces', 'ui-serif', 'Georgia', 'serif'],
                   },
                   colors: {
                       navy: { DEFAULT: '#1B2A41', light: '#22344F', dark: '#101826' },
                       sky: { DEFAULT: '#2C6E9B', light: '#5C93B8', dim: '#1F5278' },
                       crimson: { DEFAULT: '#B93A31', dim: '#9E2F28' },
                       moss: { DEFAULT: '#4F6136', dim: '#3E4C2A' },
                       paper: { DEFAULT: '#F7F3EC', 200: '#EDE6DA' },
                       ink: { 950: '#141310', 900: '#221F19', 850: '#2B2B2B', 800: '#3A3529', 700: '#4A4438', 600: '#5A5A5A' },
                       // slate-* dipakai ratusan kali (bg-slate-100 latar halaman,
                       // text-slate-500/900 teks, border-slate-200/300) — override
                       // seluruh skala jadi krem/ink hangat, urutan gelap-terang
                       // dipertahankan sama seperti Tailwind asli.
                       slate: {
                           50: '#FBF9F5', 100: '#F7F3EC', 200: '#EDE6DA', 300: '#DCD2C0',
                           400: '#948870', 500: '#5C5548', 600: '#4A4438', 700: '#3A3529',
                           800: '#2B2B2B', 900: '#221F19',
                       },
                       // hanya shade yang benar-benar dipakai (50/100/200 latar
                       // pelanggaran, 600/700 teks) digelapkan supaya kontras
                       // AA di atas paper; shade lain tetap Tailwind default.
                       amber: {
                           50: '#FBF2E2', 100: '#F5E6C8', 200: '#EAD3A0',
                           600: '#93611A', 700: '#8A5A12',
                       },
                   },
               }
           }
       }
   </script>
   <style>
       * { font-family: 'Work Sans', ui-sans-serif, system-ui, sans-serif; }
       .font-display { font-family: 'Fraunces', ui-serif, Georgia, serif; }
       ::-webkit-scrollbar { width: 4px; height: 4px; }
       ::-webkit-scrollbar-thumb { background: #4A4438; border-radius: 4px; }
       ::-webkit-scrollbar-track { background: transparent; }
       :focus-visible { outline: 2px solid #1F5278; outline-offset: 2px; }
       @media (prefers-reduced-motion: reduce) {
           .animate-rise, .animate-pop, .animate-ping { animation: none !important; }
       }
       @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
       .animate-rise { animation: riseIn .28s ease-out; }
       @keyframes popIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: scale(1); } }
       .animate-pop { animation: popIn .18s ease-out; }
   </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen m-0">

   <div id="root" class="w-full min-h-screen relative"></div>

   <!-- Kode dipecah jadi beberapa file .js supaya gampang dirawat, tapi supaya
        urutan pemuatannya PASTI benar (tidak bergantung ke Babel menebak urutan
        sendiri), index.html ini yang ambil semua file (paralel, lihat komentar
        di bawah), gabungkan jadi satu SESUAI URUTAN ARRAY, baru diproses
        sekali jalan. -->
   <script>
       (async function loadSigapApp() {
           // Naikkan angka ini SETIAP KALI isi salah satu file .js di bawah berubah
           // (setiap deploy) — supaya browser ambil versi baru, bukan cache lama.
           // Sengaja bukan Date.now() (berubah tiap milidetik): itu bikin browser
           // TIDAK PERNAH bisa cache file-file ini, jadi download ulang total
           // setiap kali aplikasi dibuka, walau isinya belum berubah sama sekali.
           var BUILD_VERSION = 43;
           var files = [
               'config.js',
               'helpers.js',
               'ui-common.js',
               'admin.js',
               'beranda-riwayat.js',
               'statistik.js',
               'gerbang.js',
               'pelanggaran-bimbingan-upacara.js',
               'rekap-kelas.js',
               'app.js'
           ];
           try {
               // Ambil semua file SEKALIGUS (paralel), bukan satu-satu berurutan —
               // sebelumnya ini 10 round-trip jaringan berturutan sebelum app mulai
               // jalan. Promise.all tetap menjaga urutan hasil sesuai array `files`
               // walau responsnya datang tidak berurutan, jadi urutan gabungan kode
               // tetap PASTI benar seperti sebelumnya.
               var responses = await Promise.all(files.map(function (f) { return fetch(f + '?v=' + BUILD_VERSION); }));
               var texts = await Promise.all(responses.map(function (res, i) {
                   if (!res.ok) throw new Error('Gagal memuat ' + files[i] + ' (status ' + res.status + ')');
                   return res.text();
               }));
               var combined = texts.join('\n');
               // runtime: 'classic' dipaksa eksplisit — Babel standalone terbaru dari
               // CDN (versi tidak dipin) defaultnya berubah ke JSX runtime 'automatic',
               // yang menyisipkan `import ... from "react/jsx-runtime"` di awal kode.
               // Statement import itu bikin appendChild(script) gagal total (SyntaxError:
               // Cannot use import statement outside a module) karena skrip ini bukan
               // ES module — hasilnya layar putih kosong tanpa pesan error yang jelas.
               var transformed = Babel.transform(combined, { presets: [['react', { runtime: 'classic' }]] }).code;
               var script = document.createElement('script');
               script.textContent = transformed;
               document.body.appendChild(script);
           } catch (err) {
               document.getElementById('root').innerHTML =
                   '<div style="padding:24px;font-family:sans-serif;color:#B93A31;">' +
                   '<b>Gagal memuat aplikasi.</b><br>' + err.message +
                   '<br><br>Coba refresh halaman. Kalau tetap gagal, cek apakah semua file .js sudah ter-upload ke GitHub.</div>';
               console.error('SIGAP load error:', err);
           }
       })();
   </script>
</body>
</html>
