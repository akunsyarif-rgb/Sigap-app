<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SIGAP - SMAN 2 Tarakan</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 flex items-center justify-center min-h-screen m-0 font-sans">

    <div id="root" class="w-full h-screen sm:h-[844px] sm:max-w-[390px] sm:rounded-[40px] sm:border-[8px] sm:border-gray-800 bg-gray-900 flex flex-col overflow-hidden shadow-2xl relative"></div>

    <script type="text/babel">
        // ⚠️ PASTIKAN LINK INI SESUAI DENGAN WEB APP GOOGLE SCRIPT ANDA
        const API_URL = "https://script.google.com/macros/s/AKfycbxMh_A5xbwfff7GwgojVLyCRXjpl2FyyTSIf8HvkTxOx4w6zasLZ9VDhMNraEux1tAztg/exec";

        function App() {
            const [user, setUser] = React.useState(null);
            const [passwordInput, setPasswordInput] = React.useState('');
            const [loadingLogin, setLoadingLogin] = React.useState(false);
            const [loginError, setLoginError] = React.useState('');

            const [activeTab, setActiveTab] = React.useState('scan');
            const [searchQuery, setSearchQuery] = React.useState('');
            const [selectedStudent, setSelectedStudent] = React.useState(null);
            const [customReasonInput, setCustomReasonInput] = React.useState('');
            const [toast, setToast] = React.useState(null);
            const [students, setStudents] = React.useState([]);
            const [allLogs, setAllLogs] = React.useState([]);
            const [loadingLogs, setLoadingLogs] = React.useState(false);

            React.useEffect(() => {
                if (user) {
                    fetchData();
                }
            }, [user]);

            const fetchData = () => {
                setLoadingLogs(true);
                fetch(`${API_URL}?action=getStudents`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') setStudents(data.students);
                    });

                fetch(`${API_URL}?action=getLogs`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') setAllLogs(data.logs);
                        setLoadingLogs(false);
                    })
                    .catch(() => setLoadingLogs(false));
            };

            const handleLogin = (e) => {
                e.preventDefault();
                setLoadingLogin(true);
                setLoginError('');

                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'login', password: passwordInput })
                })
                .then(res => res.json())
                .then(data => {
                    setLoadingLogin(false);
                    if (data.status === 'success') {
                        setUser(data.user);
                    } else {
                        setLoginError(data.message || 'Password salah!');
                    }
                })
                .catch(() => {
                    setLoadingLogin(false);
                    setLoginError('Koneksi Gagal. Coba lagi.');
                });
            };

            const filteredStudents = searchQuery.trim() === '' ? [] : students.filter(s => 
                s.name.toLowerCase().includes(searchQuery.toLowerCase()) || 
                s.class.toLowerCase().includes(searchQuery.toLowerCase())
            );

            const handleRecord = (type) => {
                const finalType = type === 'Custom' ? (customReasonInput.trim() || 'Lainnya') : type;

                const payload = {
                    action: 'record',
                    nisn: selectedStudent.nisn,
                    name: selectedStudent.name,
                    class_name: selectedStudent.class,
                    type: finalType,
                    logged_by: user.name
                };

                fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                }).then(() => {
                    fetchData();
                }).catch(err => console.error("Gagal simpan:", err));

                setToast(`Berhasil mencatat: ${selectedStudent.name}`);
                setSelectedStudent(null);
                setSearchQuery('');
                setCustomReasonInput('');

                setTimeout(() => setToast(null), 3000);
            };

            const todayStr = new Date().toDateString();
            const todayLogs = allLogs.filter(log => new Date(log.timestamp).toDateString() === todayStr);
            const archiveLogs = allLogs.filter(log => new Date(log.timestamp).toDateString() !== todayStr);

            if (!user) {
                return (
                    <div className="flex flex-col h-full justify-center p-6 bg-gray-900 text-gray-100 overflow-y-auto">
                        <div className="text-center mb-6">
                            {/* Logo Diperbesar Menjadi Hampir Setengah Tampilan (w-48 h-48) */}
                            <img src="IMG_1966.jpeg" alt="Logo SMAN 2 Tarakan" className="w-48 h-48 object-contain rounded-3xl mx-auto mb-4 shadow-2xl bg-white/5 p-2 border-2 border-emerald-500/50" />
                            <h1 className="text-2xl font-bold text-emerald-400">SIGAP</h1>
                            <p className="text-xs text-gray-400 mt-1">SMAN 2 Tarakan • Sistem Gerbang & Catat Cepat</p>
                        </div>

                        <form onSubmit={handleLogin} className="space-y-4 bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl">
                            <div>
                                <label className="text-xs text-gray-400 font-medium mb-1 block">Password Guru (contoh: budi2026):</label>
                                <input 
                                    type="password"
                                    value={passwordInput}
                                    onChange={(e) => setPasswordInput(e.target.value)}
                                    placeholder="Masukkan password..."
                                    className="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500 transition"
                                    required
                                />
                            </div>

                            {loginError && <div className="text-xs text-rose-400 font-medium text-center">{loginError}</div>}

                            <button 
                                type="submit"
                                disabled={loadingLogin}
                                className="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-3 rounded-xl font-semibold text-sm shadow transition active:scale-95 disabled:opacity-50"
                            >
                                {loadingLogin ? 'Memeriksa...' : 'Masuk Aplikasi'}
                            </button>
                        </form>
                    </div>
                );
            }

            return (
                <div className="flex flex-col h-full bg-gray-900 text-gray-100 relative select-none">
                    
                    {/* Header */}
                    <div className="bg-gray-800 px-4 py-3 flex items-center justify-between border-b border-gray-700">
                        <div className="flex items-center space-x-3">
                            <img src="IMG_1966.jpeg" alt="Logo" className="w-10 h-10 object-contain rounded-xl bg-white/5 p-0.5 border border-gray-700" />
                            <div>
                                <h1 className="font-bold text-xs uppercase tracking-wider text-emerald-400">SMAN 2 Tarakan</h1>
                                <p className="text-[10px] text-gray-400">Petugas: <span className="text-white font-medium">{user.name}</span></p>
                            </div>
                        </div>
                        <button 
                            onClick={() => setUser(null)}
                            className="text-[10px] bg-gray-700 hover:bg-gray-600 text-gray-300 px-2.5 py-1.5 rounded-lg border border-gray-600 transition"
                        >
                            Keluar
                        </button>
                    </div>

                    {/* Toast Notification */}
                    {toast && (
                        <div className="absolute top-16 left-4 right-4 z-50 bg-emerald-600 text-white text-xs px-4 py-3 rounded-xl shadow-lg flex items-center justify-between animate-bounce">
                            <span>{toast}</span>
                            <span className="font-bold bg-emerald-700 px-2 py-0.5 rounded">OK</span>
                        </div>
                    )}

                    {/* Konten Berdasarkan Tab Menu */}
                    <div className="flex-1 overflow-y-auto p-4 pb-20">
                        {activeTab === 'scan' && (
                            <div className="space-y-4">
                                <div className="bg-gray-800 border-2 border-dashed border-gray-600 rounded-2xl p-4 flex flex-col items-center justify-center relative">
                                    <div className="w-48 h-32 border-2 border-emerald-500 rounded-xl flex items-center justify-center relative overflow-hidden bg-gray-900/50 shadow-inner">
                                        <div className="absolute inset-x-0 h-0.5 bg-emerald-400 animate-pulse top-1/2"></div>
                                        <span className="text-xs text-gray-400 text-center px-2">Arahkan kartu siswa ke area kotak</span>
                                    </div>
                                    {students.length > 0 && (
                                        <button 
                                            onClick={() => setSelectedStudent(students[0])}
                                            className="mt-3 w-full bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow transition active:scale-95"
                                        >
                                            ⚡ Simulasi Scan ({students[0].name})
                                        </button>
                                    )}
                                </div>

                                <div>
                                    <label className="text-xs text-gray-400 font-medium mb-1 block">Cari Nama / Kelas Siswa:</label>
                                    <input 
                                        type="text"
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        placeholder="Ketik nama siswa..."
                                        className="w-full bg-gray-800 border border-gray-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 transition"
                                    />
                                </div>

                                {searchQuery.trim() !== '' && (
                                    <div className="bg-gray-800 rounded-xl border border-gray-700 overflow-hidden shadow-lg">
                                        <div className="px-3 py-2 bg-gray-750 border-b border-gray-700 text-xs text-gray-400 font-medium">
                                            Hasil Pencarian ({filteredStudents.length})
                                        </div>
                                        {filteredStudents.length > 0 ? (
                                            filteredStudents.map(student => (
                                                <div 
                                                    key={student.nisn}
                                                    onClick={() => setSelectedStudent(student)}
                                                    className="px-4 py-3 border-b border-gray-700/50 flex items-center justify-between hover:bg-gray-750 active:bg-gray-700 cursor-pointer transition"
                                                >
                                                    <div>
                                                        <div className="font-semibold text-sm text-white">{student.name}</div>
                                                        <div className="text-xs text-gray-400">{student.class} • NISN: {student.nisn}</div>
                                                    </div>
                                                    <span className="text-xs bg-emerald-950 text-emerald-400 border border-emerald-800 px-2.5 py-1 rounded-lg font-medium">Pilih</span>
                                                </div>
                                            ))
                                        ) : (
                                            <div className="p-4 text-center text-xs text-gray-500">Siswa tidak ditemukan</div>
                                        )}
                                    </div>
                                )}
                            </div>
                        )}

                        {activeTab === 'today' && (
                            <div className="space-y-3">
                                <div className="flex justify-between items-center mb-1">
                                    <h2 className="text-xs font-bold text-gray-300 uppercase tracking-wider">Terlambat Hari Ini ({todayLogs.length})</h2>
                                    <button onClick={fetchData} className="text-[10px] text-emerald-400 underline">Refresh</button>
                                </div>
                                {loadingLogs ? (
                                    <div className="text-center py-10 text-xs text-gray-500">Memuat data...</div>
                                ) : todayLogs.length > 0 ? (
                                    todayLogs.map((log, idx) => (
                                        <div key={idx} className="bg-gray-800 border border-gray-700 p-3.5 rounded-xl shadow space-y-1">
                                            <div className="flex items-center justify-between">
                                                <div className="font-semibold text-sm text-white">{log.name}</div>
                                                <span className="text-[10px] bg-amber-950 text-amber-400 border border-amber-800 px-2 py-0.5 rounded-full font-medium">
                                                    {log.type}
                                                </span>
                                            </div>
                                            <div className="text-[11px] text-gray-400 flex justify-between">
                                                <span>{log.class} • {new Date(log.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</span>
                                                <span className="italic text-emerald-400">Petugas: {log.logged_by}</span>
                                            </div>
                                        </div>
                                    ))
                                ) : (
                                    <div className="text-center py-12 text-gray-500 text-xs">Belum ada data tercatat hari ini.</div>
                                )}
                            </div>
                        )}

                        {activeTab === 'archive' && (
                            <div className="space-y-3">
                                <h2 className="text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Riwayat Hari Sebelumnya ({archiveLogs.length})</h2>
                                {loadingLogs ? (
                                    <div className="text-center py-10 text-xs text-gray-500">Memuat data...</div>
                                ) : archiveLogs.length > 0 ? (
                                    archiveLogs.map((log, idx) => (
                                        <div key={idx} className="bg-gray-800 border border-gray-700 p-3.5 rounded-xl shadow space-y-1">
                                            <div className="flex items-center justify-between">
                                                <div className="font-semibold text-sm text-white">{log.name}</div>
                                                <span className="text-[10px] bg-blue-950 text-blue-400 border border-blue-800 px-2 py-0.5 rounded-full font-medium">
                                                    {log.type}
                                                </span>
                                            </div>
                                            <div className="text-[11px] text-gray-400 flex justify-between">
                                                <span>{log.class} • {new Date(log.timestamp).toLocaleDateString()}</span>
                                                <span className="italic text-emerald-400">Petugas: {log.logged_by}</span>
                                            </div>
                                        </div>
                                    ))
                                ) : (
                                    <div className="text-center py-12 text-gray-500 text-xs">Belum ada arsip hari sebelumnya.</div>
                                )}
                            </div>
                        )}

                        {activeTab === 'stats' && (
                            <div className="space-y-4">
                                <h2 className="text-xs font-bold text-gray-300 uppercase tracking-wider mb-2">Statistik & Kelola Data</h2>
                                
                                <div className="grid grid-cols-2 gap-3">
                                    <div className="bg-gray-800 border border-gray-700 p-3.5 rounded-xl text-center">
                                        <div className="text-2xl font-bold text-emerald-400">{todayLogs.length}</div>
                                        <div className="text-[10px] text-gray-400 mt-1">Total Hari Ini</div>
                                    </div>
                                    <div className="bg-gray-800 border border-gray-700 p-3.5 rounded-xl text-center">
                                        <div className="text-2xl font-bold text-blue-400">{allLogs.length}</div>
                                        <div className="text-[10px] text-gray-400 mt-1">Total Keseluruhan</div>
                                    </div>
                                </div>

                                <div className="bg-gray-800 border border-gray-700 p-4 rounded-xl space-y-3">
                                    <h3 className="text-xs font-semibold text-white">📁 Unduh & Lihat Data Master</h3>
                                    <p className="text-[11px] text-gray-400">Semua data tersimpan otomatis di Google Sheets sekolah. Anda dapat melihat rekap penuh atau mengunduhnya langsung dalam format Excel/CSV.</p>
                                    <a 
                                        href="https://docs.google.com/spreadsheets" 
                                        target="_blank" 
                                        className="block w-full text-center bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl text-xs font-semibold transition shadow"
                                    >
                                        📊 Buka Google Spreadsheet
                                    </a>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* Modal Konfirmasi Pelanggaran */}
                    {selectedStudent && (
                        <div className="absolute inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
                            <div className="bg-gray-800 w-full sm:max-w-sm rounded-t-3xl sm:rounded-2xl p-5 border border-gray-700 shadow-2xl space-y-3 animate-in">
                                <div className="text-center">
                                    <div className="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-2 sm:hidden"></div>
                                    <h3 className="text-[11px] text-emerald-400 uppercase tracking-wider font-semibold">Pilih Keterangan Alasan</h3>
                                    <div className="text-lg font-bold text-white mt-0.5">{selectedStudent.name}</div>
                                    <div className="text-xs text-gray-400">{selectedStudent.class}</div>
                                </div>

                                <div className="grid grid-cols-2 gap-2">
                                    <button onClick={() => handleRecord('Terlambat bangun')} className="bg-amber-600 hover:bg-amber-500 text-white py-2.5 px-2 rounded-xl font-semibold text-xs shadow transition active:scale-95 text-center">
                                        ⏰ Terlambat bangun
                                    </button>
                                    <button onClick={() => handleRecord('Hujan')} className="bg-blue-600 hover:bg-blue-500 text-white py-2.5 px-2 rounded-xl font-semibold text-xs shadow transition active:scale-95 text-center">
                                        🌧️ Hujan
                                    </button>
                                    <button onClick={() => handleRecord('Kendaraan bermasalah')} className="bg-purple-600 hover:bg-purple-500 text-white py-2.5 px-2 rounded-xl font-semibold text-xs shadow transition active:scale-95 text-center">
                                        🏍️ Kendaraan bermasalah
                                    </button>
                                    <button onClick={() => handleRecord('Keperluan mengantar org tua/saudara')} className="bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 px-2 rounded-xl font-semibold text-xs shadow transition active:scale-95 text-center text-[11px]">
                                        👥 Mengantar keluarga
                                    </button>
                                </div>

                                <div className="pt-1 border-t border-gray-700">
                                    <label className="text-[10px] text-gray-400 font-medium mb-1 block">Atau Ketik Alasan Lainnya:</label>
                                    <div className="flex gap-2">
                                        <input 
                                            type="text"
                                            value={customReasonInput}
                                            onChange={(e) => setCustomReasonInput(e.target.value)}
                                            placeholder="Tulis alasan khusus..."
                                            className="flex-1 bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"
                                        />
                                        <button onClick={() => handleRecord('Custom')} disabled={!customReasonInput.trim()} className="bg-emerald-600 hover:bg-emerald-500 disabled:opacity-40 text-white px-3 py-2 rounded-xl text-xs font-semibold transition">
                                            Simpan
                                        </button>
                                    </div>
                                </div>

                                <button onClick={() => setSelectedStudent(null)} className="w-full bg-gray-700 hover:bg-gray-600 text-gray-300 py-2 rounded-xl font-medium text-xs transition">
                                    Batal
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Bottom Navigation */}
                    <div className="absolute bottom-0 inset-x-0 bg-gray-800 border-t border-gray-700 flex justify-around py-2.5 px-2 z-40">
                        <button onClick={() => setActiveTab('scan')} className={`flex flex-col items-center space-y-0.5 transition ${activeTab === 'scan' ? 'text-emerald-400' : 'text-gray-400'}`}>
                            <span className="text-base">⚡</span>
                            <span className="text-[9px] font-medium">Gerbang</span>
                        </button>
                        <button onClick={() => setActiveTab('today')} className={`flex flex-col items-center space-y-0.5 transition ${activeTab === 'today' ? 'text-emerald-400' : 'text-gray-400'}`}>
                            <span className="text-base">📋</span>
                            <span className="text-[9px] font-medium">Hari Ini</span>
                        </button>
                        <button onClick={() => setActiveTab('archive')} className={`flex flex-col items-center space-y-0.5 transition ${activeTab === 'archive' ? 'text-emerald-400' : 'text-gray-400'}`}>
                            <span className="text-base">📅</span>
                            <span className="text-[9px] font-medium">Sebelumnya</span>
                        </button>
                        <button onClick={() => setActiveTab('stats')} className={`flex flex-col items-center space-y-0.5 transition ${activeTab === 'stats' ? 'text-emerald-400' : 'text-gray-400'}`}>
                            <span className="text-base">📊</span>
                            <span className="text-[9px] font-medium">Statistik</span>
                        </button>
                    </div>

                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
